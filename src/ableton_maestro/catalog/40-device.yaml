# =============================================================================
# DeviceParameter
#   Live.DeviceParameter.DeviceParameter. This is where nearly every measured
#   trap about values lives (docs/protocol.md §7).
# =============================================================================

- id: param.value
  path: song.tracks[{track}].devices[{device}].parameters[{param}]
  access: [get, observe, automate]
  kind: float
  unit: normalized
  display: native
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    A device parameter's value. The path addresses the DeviceParameter itself:
    lom_get/lom_set operate on its .value and additionally return `display` from
    str_for_value() (docs/protocol.md §5.3, §5.4). Three measured things to hold at once.
    (1) The value is usually NORMALISED, not physical: an Auto Filter or EQ Eight
    Frequency runs 0..1 across 20 Hz..20 kHz (norm = log10(hz/20)/3), a track volume of
    0.85 is 0 dB, and a raw 0.5 is not "half" of anything. Beware the wrong 30 Hz variant
    of that formula: aiming at 100 Hz with it lands on 71.9 Hz, 572 cents off, with no
    error. (2) Not every parameter runs 0..1: Glue Compressor Threshold is -40..0 dB.
    Read param.min and param.max instead of assuming. (3) Every parameter has its own
    curve from 0..1 onto its unit, and it is not linear: on one third-party compressor
    measured here, Attack is v^4 x
    1000 ms, so writing an "Attack of 10 ms" linearly sets 316 ms: factor 30 off,
    silently. Where the device reports a display, prefer a display-driven search over
    arithmetic; where it does not (all VST2), write normalised and calibrate by eye once.
    This path resolves to the DeviceParameter OBJECT. It is the correct target for
    automation_write's 'parameter' argument, and lom_get on it still carries 'display'. It
    is NOT writable - lom_set answers not_settable. To write the number, use the companion
    'param.value_raw' row, whose path ends in .value.
    Read verified 2026-08-30 against Live 12.4.5 at song.tracks[10].devices[3].parameters
    through lom_describe: a ATimeableValueVector of 84 element(s). No write, call, observation
    or automation was attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}
    - {name: param, kind: int, required: true}

- id: param.value_raw
  path: song.tracks[{track}].devices[{device}].parameters[{param}].value
  access: [get, set, observe]
  kind: float
  unit: normalized
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    The same value addressed explicitly as `.value` rather than through the
    DeviceParameter object. Resolves the same way but loses the `display` field in the
    response, because the script only attaches display when the target IS a
    DeviceParameter (docs/protocol.md §5.3). Prefer param.value; this row exists so that
    the explicit form is documented rather than discovered.
    Write verified 2026-08-29 against Live 12.4.5: read, written, read back and RESTORED
    to the original value. This is the writable companion; the parameter object itself is
    not settable.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}
    - {name: param, kind: int, required: true}

- id: param.name
  path: song.tracks[{track}].devices[{device}].parameters[{param}].name
  access: [get]
  kind: str
  unit: none
  destructive: false
