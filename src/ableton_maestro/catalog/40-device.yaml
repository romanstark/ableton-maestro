- id: return_device.type
  path: song.return_tracks[{return}].devices[{device}].type
  access: [get]
  kind: enum
  enum: [0, 1, 2, 4]
  range: [0, 3]
  unit: none
  destructive: false
  verify: none
  status: verified
  means:
    "0": >-
      undefined
    "1": >-
      instrument
    "2": >-
      audio_effect
    "4": >-
      midi_effect - and it is 4, not 3: this enum has no value 3 at all
  doc: >-
    Device kind on a return track; in practice always audio_effect. Wire value
    is the integer index. See device.type for the caveat on the ordering.
    Read verified 2026-08-30 against Live 12.4.5 at song.return_tracks[0].devices[0].type
    through lom_describe: returned 2 (int). No write, call, observation or automation was
    attempted on this row.
    Value names read off Live.Device.DeviceType through the enum_names handler (docs/protocol.md
    section 5.12), measured 2026-08-31 against Live 12.4.5 - not transcribed from a reference.
