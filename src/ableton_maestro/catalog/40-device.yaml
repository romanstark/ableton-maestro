# =============================================================================
# Simpler: Live.SimplerDevice.SimplerDevice
#
#   EVERY ROW IN THIS BLOCK IS UNVERIFIED. Simpler is the one stock instrument
#   the LOM extends with real structure (a Sample object, slicing, warping)
#   rather than leaving it at a flat parameter list, which makes it worth
#   cataloguing: but nothing here has been run against Live, and several of
#   the sub-properties differ between Live versions. Guard every path with
#   device.class_name == "OriginalSimpler"; on any other device these are
#   expected to answer no_such_path.
#
#   The paths below address a Simpler sitting directly on a track. A Simpler
#   inside a Drum Rack pad has the same properties one level deeper: see the
#   simpler.pad_* rows at the end of this block for that shape.
# =============================================================================

- id: simpler.playback_mode
  path: song.tracks[{track}].devices[{device}].playback_mode
  access: [get, set, observe]
  kind: enum
  enum: [0, 1, 2]
  range: [0, 2]
  unit: none
  destructive: false
  verify: read_back
  status: verified
  means:
    "0": >-
      classic
    "1": >-
      one_shot
    "2": >-
      slicing
  doc: >-
    Simpler's three modes. The wire value is the integer index; this ordering follows the LOM's
    PlaybackMode and has not been measured. Switching to slicing rebuilds the sample's slice
    list and therefore changes what the device responds to on every note: it is a structural
    change, not a setting. Read verified 2026-08-29 against Live 12.4.5; a write was NOT
    attempted on this row.
    Value names read off Live.SimplerDevice.PlaybackMode through the enum_names handler
