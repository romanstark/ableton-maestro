# --------------------------------------------------------------------------------
# Drum pads of a NESTED drum rack; the shape a real kit actually has.
#
# Measured 2026-08-30 against Live 12.4.5: loading "808 Boom Kit.adg" (from a Pack,
# by drag and by Browser.load_item alike) produces an InstrumentGroupDevice that
# WRAPS the DrumGroupDevice. The pads are therefore two levels down:
#
#   devices[1]                          InstrumentGroupDevice  "808 Boom Kit"
#     chains[0].devices[0]              DrumGroupDevice        "808 Boom Kit"  <- pads
#     chains[0].devices[1]              AudioEffectGroupDevice "Beat Tools Drum Effects"
#
# The nesting belongs to the preset, not to how it was loaded, so this is the
# common case and the flat `drum_pad.*` family is the exception; it only resolves
# for a bare, hand-placed Drum Rack. Both are kept: neither shape is wrong, and a
# path cannot search for the rack wherever it happens to sit.
# --------------------------------------------------------------------------------

