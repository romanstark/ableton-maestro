  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: rack.recall_last_used_variation
  path: song.tracks[{track}].devices[{device}]
  access: [call]
  method: recall_last_used_variation
  destructive: false
  verify: none
  status: verified
  doc: >-
    Re-apply whichever variation was last recalled. Args: []. Useful to undo an experimental
    macro move without touching Live's undo stack. Live 11 and later. Read verified 2026-08-29
    against Live 12.4.5 on a populated rack (808 Boom Kit inside an Instrument Rack;
    Disharmonics inside an Audio Effect Rack). A write was NOT attempted.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: rack.delete_selected_variation
  path: song.tracks[{track}].devices[{device}]
  access: [call]
  method: delete_selected_variation
  destructive: true
  verify: none
  status: verified
  doc: >-
    Delete the selected macro variation. Args: []. Destructive and shifts the indices of the
    later variations. Live 11 and later. Read verified 2026-08-29 against Live 12.4.5 on a
    populated rack (808 Boom Kit inside an Instrument Rack; Disharmonics inside an Audio Effect
    Rack). A write was NOT attempted.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: rack.randomize_macros
  path: song.tracks[{track}].devices[{device}]
  access: [call]
  method: randomize_macros
  destructive: true
  verify: none
  status: verified
  doc: >-
    Randomise every macro position at once (Live 11+). Args: []. Marked destructive because it
    discards the current macro values with no snapshot: store a variation first if they are
