    attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: rack.store_variation
  path: song.tracks[{track}].devices[{device}]
  access: [call]
  method: store_variation
  destructive: false
  verify: none
  status: verified
  doc: >-
    Store the current macro positions as a new variation. Args: []. Verify with
    rack.variation_count. Live 11 and later. Read verified 2026-08-29 against Live 12.4.5 on a
    populated rack (808 Boom Kit inside an Instrument Rack; Disharmonics inside an Audio Effect
    Rack). A write was NOT attempted.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: rack.recall_selected_variation
  path: song.tracks[{track}].devices[{device}]
  access: [call]
  method: recall_selected_variation
  destructive: false
  verify: none
