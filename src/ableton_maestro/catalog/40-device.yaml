    on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: simpler.sample_slicing_sensitivity
  path: song.tracks[{track}].devices[{device}].sample.slicing_sensitivity
  access: [get, set, observe]
  kind: float
  range: [0.0, 1.0]
  unit: normalized
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    Transient sensitivity as stored on the Sample, alongside the device-level
    simpler.slicing_sensitivity. Whether these are two views of one value or two separate values
    is not measured: read both before assuming. Read verified 2026-08-29 against Live 12.4.5; a
    write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: simpler.sample_slicing_style
  path: song.tracks[{track}].devices[{device}].sample.slicing_style
  access: [get, set, observe]
  kind: enum
  enum: [0, 1, 2, 3]
  range: [0, 3]
  unit: none
  destructive: false
  verify: read_back
  status: verified
  means:
    "0": >-
      transient
    "1": >-
      beat
    "2": >-
      region
    "3": >-
      manual
  doc: >-
    Slicing algorithm as stored on the Sample. Same uncertainty as
    simpler.sample_slicing_sensitivity: it may or may not be the same value as
    simpler.slicing_style, and that is not measured. Read verified 2026-08-29 against Live
    12.4.5; a write was NOT attempted on this row.
    Value names read off Live.Sample.SlicingStyle through the enum_names handler
    (docs/protocol.md section 5.12), measured 2026-08-31 against Live 12.4.5 - not transcribed
    from a reference. Cycling 74's LOM documentation agrees.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: simpler.crop
  path: song.tracks[{track}].devices[{device}]
  access: [call]
  method: crop
  destructive: true
  verify: none
  status: verified
  doc: >-
    Discard everything outside the start and end markers. Args: []. DESTRUCTIVE in the strongest
    sense in this file: it rewrites what the device plays and the markers can no longer be
    widened afterwards. Read the markers first. Call verified 2026-08-30 against Live 12.4.5:
    end_marker was set to half the sample and crop() called; the sample's length read back 84672
    against 169344 before. It is NOT an in-memory edit - file_path moved to a new file Live
    rendered under <project>/Samples/Processed/Crop/, named with a timestamp. Not reversible.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: simpler.reverse
  path: song.tracks[{track}].devices[{device}]
  access: [call]
  method: reverse
  destructive: false
  verify: none
  status: verified
  doc: >-
    Play the sample backwards. Args: []. Calling it twice restores the original direction, so it
    is reversible in practice. Call verified 2026-08-30 against Live 12.4.5: called on a loaded
    sample. file_path moved from the original to a file Live rendered under
    <project>/Samples/Processed/Reverse/, and the slice positions were recomputed. Calling it a
    second time restored the original path and slices, so it toggles - but each direction writes
    audio to disk.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: simpler.warp_as
  path: song.tracks[{track}].devices[{device}]
  access: [call]
  method: warp_as
  destructive: false
  verify: none
  status: verified
  doc: >-
    Re-interpret the sample as being a given number of beats long, the way
    Live's "Warp as N Bars" does. Args: [length_in_beats]. Check
    simpler.can_warp_as first. Measured context: short files are rounded to
    whole bars and long ones get a GUESSED tempo, so what Live decided on
    import is often not what the material actually is.
    Call verified 2026-08-30 against Live 12.4.5: signature warp_as(double beat_time) - it
    takes an argument, unlike the other warp calls. Called with 4; the sample's warping read
    back false -> true.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: simpler.warp_double
  path: song.tracks[{track}].devices[{device}]
  access: [call]
  method: warp_double
  destructive: false
  verify: none
  status: verified
  doc: >-
    Halve the sample's assumed tempo, doubling its length in beats. Args: []. The fix when Live
    imported a loop at double speed. Check simpler.can_warp_double first. Measured 2026-08-30
    against Live 12.4.5: the call is ACCEPTED and returns without error even while
    can_warp_double reads false, and it changes nothing. After warping the sample the flag
    turned true, and the call still produced no change readable through the LOM - not in the
    sample's warp_markers, not in guess_playback_length. A caller cannot tell success from a
    silent no-op here, so read can_warp_double first and treat the call as unconfirmed either
    way.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: simpler.warp_half
  path: song.tracks[{track}].devices[{device}]
  access: [call]
  method: warp_half
  destructive: false
  verify: none
  status: verified
  doc: >-
    Double the sample's assumed tempo, halving its length in beats. Args: []. Check
    simpler.can_warp_half first. Measured 2026-08-30 against Live 12.4.5 - see
    simpler.warp_double. Same shape: accepted while can_warp_half reads false, and no effect
    readable through the LOM in either state.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: simpler.guess_playback_length
  path: song.tracks[{track}].devices[{device}]
  access: [call]
  method: guess_playback_length
  destructive: false
  verify: none
  status: verified
  doc: >-
    Let Live re-guess how long the sample is in beats. Args: []. A guess, and labelled as one by
    its own name: verify against the material rather than trusting the answer. Call verified
    2026-08-30 against Live 12.4.5: takes no arguments and RETURNS a float - 8 for the sample
    under test. A read, not a write.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: sample.insert_slice
  path: song.tracks[{track}].devices[{device}].sample
  access: [call]
  method: insert_slice
  destructive: false
  verify: none
  status: verified
  doc: >-
    Add a slice point. Args: [position_in_sample_frames]. Only meaningful in slicing playback
    mode with a manual or pad slicing style; an automatic style recomputes the list and discards
    the addition. Verify by reading simpler.sample_slices. Call verified 2026-08-30 against Live
    12.4.5: signature insert_slice(int slice_time) on the Sample. Called with 5000 on a sample
    of 19 slices; slices read back 20 with 5000 in place.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: sample.move_slice
  path: song.tracks[{track}].devices[{device}].sample
  access: [call]
  method: move_slice
  destructive: false
  verify: none
  status: verified
  doc: >-
    Move an existing slice point. Args: [old_position, new_position], both in sample frames -
    the slice is identified by its position, not by an index, so read simpler.sample_slices
    immediately before calling. Call verified 2026-08-30 against Live 12.4.5: signature
    move_slice(int old_time, int new_time). It RETURNS the new time. Called with (5000, 6000);
    slices read back with 6000 where 5000 had been.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: sample.remove_slice
  path: song.tracks[{track}].devices[{device}].sample
  access: [call]
  method: remove_slice
  destructive: true
  verify: none
  status: verified
  doc: >-
    Remove one slice point. Args: [position_in_sample_frames]. Removing a slice renumbers the
    pads that play the later slices, so a clip written against the old numbering plays the wrong
    slices afterwards. Call verified 2026-08-30 against Live 12.4.5: signature remove_slice(int
    slice_time). Called with 6000; slices read back 20 -> 19, identical to the list before the
    insert.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: sample.clear_slices
  path: song.tracks[{track}].devices[{device}].sample
  access: [call]
  method: clear_slices
  destructive: true
  verify: none
  status: verified
  doc: >-
    Remove every slice point. Args: []. Destructive and it invalidates any clip written against
    the previous slice layout. Call verified 2026-08-30 against Live 12.4.5: takes no arguments.
    Called on a sample of 19 slices; slices read back as one entry, the start.
    Sample.reset_slices puts the automatic slicing back.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: simpler.pad_sample_file_path
  path: song.tracks[{track}].devices[{device}].drum_pads[{pad}].chains[{chain}].devices[{nested}].sample.file_path
  access: [get]
  kind: str
  unit: none
