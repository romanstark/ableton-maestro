    Instrument Rack; Disharmonics inside an Audio Effect Rack). A write was NOT attempted.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: rack.view.selected_chain
  path: song.tracks[{track}].devices[{device}].view.selected_chain
  access: [get, set]
  kind: object
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
