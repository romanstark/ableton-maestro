# =============================================================================
# Device input routing - the sidechain source, which is reachable after all
#
# "Sidechain routing cannot be set" is a widely held belief and it is false. The
# routing hangs on the DEVICE, not on the track, which is why looking for it
# beside track.input_routing_type finds nothing: a Compressor has its own
# input_routing_type and input_routing_channel, and they are the sidechain's
# source and tap point.
#
# The source is chosen BY REFERENCE. RoutingType exposes category and
# display_name read-only, so the write takes one of the objects out of
# available_input_routing_types, passed as {"__path__": ...}
# (docs/protocol.md section 5.5) - never a track name as a string.
#
# Arming the sidechain afterwards is the ordinary S/C On parameter, which is a
# DeviceParameter like any other and needs no row of its own: which parameters a
# device has is a runtime fact, and lom_describe answers it.
# =============================================================================

- id: device.input_routing_type
  path: song.tracks[{track}].devices[{device}].input_routing_type
  access: [get, set, observe]
  kind: object
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    The device's input source - on a compressor, the sidechain trigger. Reading gives a
    handle (docs/protocol.md section 7); read the name through
    device.input_routing_type_name. Writing takes one of the objects out of
    device.input_routing_types as {"__path__": ...}, because RoutingType's display_name is
    read-only and a plain string is not what the LOM wants.
    Write verified 2026-08-30 against Live 12.4.5 on a stock Compressor: a reference out of
    the available list answered changed true, read_back applied, reference_stored true, and
    a second independent read of display_name returned the track that was pointed at. No
    file edit and no Live restart - this is the measurement that retracted the limit.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: device.input_routing_type_name
  path: song.tracks[{track}].devices[{device}].input_routing_type.display_name
  access: [get]
  kind: str
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The source's name as Live shows it in the Audio From chooser, e.g. "3-Alpine Bass" or
    "No Input". Read-only: the source is changed by writing device.input_routing_type with a
    reference, never by writing this string.
    Read verified 2026-08-30 against Live 12.4.5: returned "1-Analog Lab V" (string) after
    that source was set by reference. A write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: device.input_routing_types
  path: song.tracks[{track}].devices[{device}].available_input_routing_types
  access: [get, observe]
  kind: object
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Every source this device will accept, as RoutingType objects. This is the list to choose
    from before writing device.input_routing_type, and it is per set rather than fixed: the
    names are the tracks that exist right now.
    Read verified 2026-08-30 against Live 12.4.5 on a four-track set: 7 entries, whose
    display_names read "1-Analog Lab V", "3-Alpine Bass", "4-Audio", "A-Reverb", "B-Delay",
    "Main" and "No Input". No write, call or observation was attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: device.input_routing_channel
  path: song.tracks[{track}].devices[{device}].input_routing_channel
  access: [get, set, observe]
  kind: object
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    Where in the source track the device listens - the tap point, and a SEPARATE write from
    the source itself. Choosing what to listen to and choosing where to listen are two
    operations, not one. Written by reference out of device.input_routing_channels, the same
    way as device.input_routing_type.
    Read verified 2026-08-30 against Live 12.4.5: returned a RoutingChannel handle whose
    display_name read "Post FX". A write was NOT attempted on this row - the source write
    beside it was, and the two share a mechanism.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: device.input_routing_channel_name
  path: song.tracks[{track}].devices[{device}].input_routing_channel.display_name
  access: [get]
  kind: str
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The tap point's name: "Pre FX", "Post FX" or "Post Mixer" - Ableton's own sidechain
    vocabulary, read back verbatim. Read-only, like the source's name.
    Read verified 2026-08-30 against Live 12.4.5: returned "Post FX" (string). A write was
    NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: device.input_routing_channels
  path: song.tracks[{track}].devices[{device}].available_input_routing_channels
  access: [get, observe]
  kind: object
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Every tap point this device offers, as RoutingChannel objects - the list to choose from
    before writing device.input_routing_channel.
    Read verified 2026-08-30 against Live 12.4.5: 3 entries, reading "Pre FX", "Post FX" and
    "Post Mixer". No write, call or observation was attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}
