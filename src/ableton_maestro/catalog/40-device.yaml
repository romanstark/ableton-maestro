# Ableton Maestro: path catalog: devices, parameters, racks, drum pads.
#
# WHY this file exists: docs/architecture.md, "the restart tax": a new capability must cost a
# catalog row, not a handler inside Live's process. Every row here is one
# addressable place in the Live Object Model, described as data so that
# `lom_get` / `lom_set` / `lom_call` can reach it without new code and without
# a Live restart. Schema: docs/architecture.md, "the catalog", wire contract: docs/protocol.md.
#
# THE HONEST LIMIT OF THIS FILE (docs/architecture.md, "the catalog", "fixed and dynamic
# surface"): the catalog describes only what is fixed at authoring time: the
# *shape* of Device, DeviceParameter, RackDevice, Chain, DrumPad. WHICH
# parameters a loaded plugin happens to expose is a runtime fact and belongs to
# `lom_describe` / lom/introspect.py, never here. A catalog that claimed to
# know every VST parameter would be a lie.
#
# status: `status` is per row, and it records a measurement rather than an
# intention. `verified` means the row was read, called or written against a
# running Live; its `doc` carries the date, the Live version and which of the
# three was done, and a row verified by reading is not thereby verified for
# writing. `broken` means the path exists and Live refuses it, and the `doc`
# says how it fails. `untested` means nobody has run it: the default, and never
# an implied "works". `scripts/probe_paths.py` and `scripts/sync_catalog.py` are
# what move a row. Only a `verified` row may be quoted as "works" in a tool
# description built on this file (docs/architecture.md, "the catalog").
#
# Two conventions used throughout this file:
#
#   path ends at the DeviceParameter, not at its `.value`
#       Matching the `track.volume` example in docs/architecture.md, "the catalog" and
#       docs/protocol.md §5.3: the script recognises a DeviceParameter target,
#       reads/writes its `.value`, and additionally returns `display` from
#       `str_for_value()`. Appending `.value` also resolves but loses `display`.
#
#   display: native
#       The row has a `str_for_value()` reading, but the physical unit is not
#       knowable at authoring time: it is whatever the device reports. Often
#       nothing, and on VST2 *always* nothing (measured).

# =============================================================================
# Device: the chain on a regular track
#   Live.Device.Device, plus the class-specific extensions Live layers on top.
# =============================================================================

- id: device.list
  path: song.tracks[{track}].devices
  access: [get, observe]
  kind: list
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Every device on the track's chain, in signal order, left to right. Two facts that
    shape how a chain must be built. First: a newly loaded effect is appended at the END
    of the chain, so a device that must sit before another one is either loaded before it
    or moved afterwards with song.move_device, which does work (measured 2026-08-30
    against Live 12.4.5). Second: a newly loaded effect is appended at the END of the chain, 
    so a compressor meant to duck a reverb tail must be loaded after the reverb, or it ducks 
    the dry input instead. Group tracks and return tracks have their own chains under their own paths.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: device.name
  path: song.tracks[{track}].devices[{device}].name
  access: [get, set, observe]
  kind: str
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    The device's user-visible name, shown in the title bar of the device, which
    the user may have renamed. It is NOT the device class: a renamed Auto Filter still has
    class_name "AutoFilter". Match on class_name when identifying a device type, on name
    only when identifying a particular instance the user has labelled.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: device.class_name
  path: song.tracks[{track}].devices[{device}].class_name
  access: [get]
  kind: str
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Live's internal class identifier, e.g. "AutoFilter", "Compressor2", "OriginalSimpler",
    "MultiSampler", "DrumGroupDevice", "InstrumentGroup", "PluginDevice",
    "AuPluginDevice", "MxDeviceInstrument". Read-only and stable across renames, so this
    is the field to branch on. Note the measured oddity that half of Live 12's instrument
    section reports "MxDeviceInstrument" (Max for Live devices) wearing a stock
    device's face.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: device.class_display_name
  path: song.tracks[{track}].devices[{device}].class_display_name
  access: [get]
  kind: str
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The device type's name as Live spells it in the browser ("Auto Filter", "Glue
    Compressor"). Read-only. Useful for reporting to a human; useless for branching,
    because it is localised in some Live builds; branch on class_name instead.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: device.type
  path: song.tracks[{track}].devices[{device}].type
  access: [get]
  kind: enum
  enum: [0, 1, 2, 4]
  range: [0, 3]
  unit: none
  destructive: false
  verify: none
  status: verified
  means:
    "0": >-
      undefined
    "1": >-
      instrument
    "2": >-
      audio_effect
    "4": >-
      midi_effect - and it is 4, not 3: this enum has no value 3 at all
  doc: >-
    Which kind of device this is. The wire value is the integer index; the enum list names the
    indices in order. The order given here follows the LOM's DeviceType and has not been
    measured. Worth knowing anyway: the instrument/effect split does NOT predict how many
    parameters a plugin exposes (measured counter-examples in both directions, a third-party
    VST instrument exposed 36 parameters while a third-party VST effect exposed one. Read
    verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row. Value names
    read off Live.Device.DeviceType through the enum_names handler (docs/protocol.md section
    5.12), measured 2026-08-31 against Live 12.4.5 - not transcribed from a reference. Cycling
    74's LOM documentation agrees.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: device.is_active
  path: song.tracks[{track}].devices[{device}].is_active
  access: [get, observe]
  kind: bool
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Whether the device is switched on. READ-ONLY in the LOM: writing here is expected to fail
    with not_settable, which is not measured. To actually switch a device off, write
    parameters[0] instead; see device.on. A device that is off passes audio through unchanged,
    which is why a read-back of a parameter proves the stored value and never the audible effect
    (docs/protocol.md §10). Read verified 2026-08-29 against Live 12.4.5; a write was NOT
    attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: device.on
  path: song.tracks[{track}].devices[{device}].parameters[0]
  access: [get, observe, automate]
  kind: float
  range: [0.0, 1.0]
  unit: normalized
  display: native
  quantized: true
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    The real on/off switch: parameter 0 is "Device On" on every Live device (measured). It
    is quantized: anything below 0.5 rounds to 0 (off) and anything
    from 0.5 up to 1 (on), so a well-meant 0.25 switches the device OFF and reports
    success. This is also the trap behind the measured bug where a missing parameter index
    silently fell back to 0 and toggled the device four times instead of setting four
    values. Use this, not device.is_active, to disable a device; it is also the safe way
    to retire a device on a return track, where deleting is not possible.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
    Measured 2026-08-29 against Live 12.4.5: this path resolves to the DeviceParameter
    OBJECT. It is the correct target for automation_write's 'parameter' argument, and
    lom_get on it still carries 'display'. It is NOT writable - lom_set answers
    not_settable. To write the number, use the companion 'device.on_value' row, whose path
    ends in .value.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: device.can_have_chains
  path: song.tracks[{track}].devices[{device}].can_have_chains
  access: [get]
  kind: bool
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    True for every rack (Instrument Rack, Audio Effect Rack, MIDI Effect Rack, Drum Rack).
    This is the guard to check before touching .chains: reading .chains on a non-rack
    raises, and an exception escaping a handler kills the client connection
    (docs/protocol.md §6).
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: device.can_have_drum_pads
  path: song.tracks[{track}].devices[{device}].can_have_drum_pads
  access: [get]
  kind: bool
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    True only for a Drum Rack (DrumGroupDevice). Check it before touching .drum_pads. A
    device can have chains without having drum pads; the reverse does not occur.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: device.parameters
  path: song.tracks[{track}].devices[{device}].parameters
  access: [get, observe]
  kind: list
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The device's automatable parameters. THIS IS NOT WHAT THE PLUGIN CAN DO: it is what the
    strip holds for THIS INSTANCE. For a plugin, how much that is depends on the plugin:
    measured 2026-09-01 against Live 12.4.5, loaded from the browser with no GUI interaction,
    two VST3 instruments from one vendor reported one parameter each, a VST3 instrument from a
    second vendor reported 29, a VST3 effect from that same first vendor 16, and a VST2 effect
    from a third vendor 17. Not the format, not the vendor - the first vendor appears at both 1
    and 16 - and not instrument versus effect. Read the count rather than predicting it. Where a
    plugin exposes little or nothing, Live's Configure mode adds parameters to the strip (press
    Configure, click the control in the plugin's own GUI, leave the mode). That is a limit in
    LIVE, not in this code: per parameter and per instance, capped at 128 slots, stored in the
    Live set rather than in the plugin, and GUI-only. So 1-2 parameters means this instance
    exposes nothing yet, not "not automatable". Read verified 2026-08-29 against Live 12.4.5; a
    write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: device.view.is_collapsed
  path: song.tracks[{track}].devices[{device}].view.is_collapsed
  access: [get, set]
  kind: bool
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    Whether the device is folded up in the device view. Cosmetic only: it changes nothing
    audible and nothing about the parameters. Read verified 2026-08-29 against Live 12.4.5; a
    write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: device.get_parameter_names
  path: song.tracks[{track}].devices[{device}]
  access: [call]
  method: get_parameter_names
  kind: list
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The names a PLUGIN declares, as opposed to the ones its strip holds. Takes no arguments.
    device.parameters reports the strip, which for a plugin can be a single entry while the
    plugin itself has hundreds - and before this there was no way to tell "this plugin exposes
    nothing" apart from "this plugin has four hundred controls and none of them is mapped".
    The position in this list is the plugin index, which is what a Configure mapping stores.
    Expect noise: program-change, MPE and MIDI-CC helper entries can run into the hundreds,
    with the real controls at the head, and the reply is capped so a long list comes back
    truncated. Present on PluginDevice; other device classes do not have it.
    Call verified 2026-09-01 against Live 12.4.5 with no arguments, on three plugin instances:
    one whose strip held a single entry answered with several hundred names, one whose strip
    held 29 answered with 30, and the two it omitted were trigger controls. Cross-checked
    against the saved file - the strip's stored ParameterId matches this list's index.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}
  args: []

- id: device.delete
  path: song.tracks[{track}]
  access: [call]
  method: delete_device
  destructive: true
  verify: none
  status: verified
  doc: >-
    Remove a device from the track's chain by its index. Args: [device_index].
    Destructive and NOT the mirror image of loading: the device's clip
    automation points at device index plus parameter index, so deleting a
    device shifts every later device's index and orphans their envelopes
    (measured: envelopes belong to a device, not to "the
    track's filter"). Re-read the chain afterwards instead of reusing indices.
    On return tracks deleting has been observed not to work; switch the device
    off via device.on instead. Verify by re-reading device.list.
    Call verified 2026-08-30 against Live 12.4.5: signature delete_device(int) on the Track. A
    device was duplicated and the copy deleted; the track's chain read back as its original
    five devices in the original order.
  params:
    - {name: track, kind: int, required: true}

- id: device.store_chosen_bank
  path: song.tracks[{track}].devices[{device}]
  access: [call]
  method: store_chosen_bank
  destructive: false
  verify: none
  status: broken
  doc: >-
    Remember which parameter bank a control surface script last selected for this device. Args:
    [script_index, bank_index]. Exists for hardware control surfaces; of no use to this server
    except completeness. Measured 2026-08-30 against Live 12.4.5: calling store_chosen_bank(0,
    0) on a device with ZERO banks CRASHED Live with EXCEPTION_ACCESS_VIOLATION; a process
    death, not an error return. The method is off the script's allowlist for that reason and
    this row is unreachable by design. There is no way to ask how many banks a device has: the bank getters exist on no device
    class in Live 12.4.5 (measured 2026-08-30 on CompressorDevice, RackDevice and a VST3
    PluginDevice), so the state this call's safety depends on cannot be read at all.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}




- id: return_device.list
  path: song.return_tracks[{return}].devices
  access: [get, observe]
  kind: list
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The device chain of a return track. Return tracks are indexed separately
    from song.tracks and are NOT part of it: iterating song.tracks never
    reaches a return. Same ordering rule as everywhere: new effects are appended, and the
    order can be corrected afterwards with song.move_device.
    Read verified 2026-08-30 against Live 12.4.5 at song.return_tracks[0].devices through
    lom_describe: a Vector of 2 element(s). No write, call, observation or automation was
    attempted on this row.
  params:
    - {name: return, kind: int, required: true}

- id: return_device.name
  path: song.return_tracks[{return}].devices[{device}].name
  access: [get, set, observe]
  kind: str
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    The device's user-visible name on a return track. See device.name.
    Read verified 2026-08-30 against Live 12.4.5 at song.return_tracks[0].devices[0].name
    through lom_describe: returned 'Reverb' (string). No write, call, observation or automation
    was attempted on this row.
  params:
    - {name: return, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: return_device.class_name
  path: song.return_tracks[{return}].devices[{device}].class_name
  access: [get]
  kind: str
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Live's internal class identifier for a return-track device. See device.class_name.
    Read verified 2026-08-30 against Live 12.4.5 at song.return_tracks[0].devices[0].class_name
    through lom_describe: returned 'Reverb' (string). No write, call, observation or automation
    was attempted on this row.
  params:
    - {name: return, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: return_device.class_display_name
  path: song.return_tracks[{return}].devices[{device}].class_display_name
  access: [get]
  kind: str
  unit: none
  destructive: false
  verify: none
