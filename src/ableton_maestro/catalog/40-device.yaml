- id: return_device.on
  path: song.return_tracks[{return}].devices[{device}].parameters[0]
  access: [get, observe, automate]
  kind: float
  range: [0.0, 1.0]
  unit: normalized
  display: native
  quantized: true
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    "Device On" of a return-track device: quantized, below 0.5 is off. This is also the
    way to retire a device on a return track: deleting a device there was measured not to
    work, so switching it off is the documented workaround. This path
    resolves to the DeviceParameter OBJECT. It is the correct target for
    automation_write's 'parameter' argument, and lom_get on it still carries 'display'. It
    is NOT writable - lom_set answers not_settable. To write the number, use the companion
    'return_device.on_value' row, whose path ends in .value.
    Read verified 2026-08-30 against Live 12.4.5 at song.return_tracks[0].devices[0].parameters
    through lom_describe: a ATimeableValueVector of 33 element(s). No write, call, observation
    or automation was attempted on this row.
  params:
    - {name: return, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: return_device.can_have_chains
  path: song.return_tracks[{return}].devices[{device}].can_have_chains
  access: [get]
  kind: bool
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Whether this return-track device is a rack. Guard before reading .chains.
    Read verified 2026-08-30 against Live 12.4.5 at
    song.return_tracks[0].devices[0].can_have_chains through lom_describe: returned False
    (bool). No write, call, observation or automation was attempted on this row.
  params:
    - {name: return, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: return_device.parameters
  path: song.return_tracks[{return}].devices[{device}].parameters
  access: [get, observe]
  kind: list
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Parameters of a return-track device. Same Configure caveat as device.parameters. Measured on
    22.08.2026: a return device's parameters came back without display_value, which made the
    display-bisection procedure impossible on returns. That was a limit of the getter used then,
    not of the LOM: str_for_value() is the same method on the same class here, so it is
    expected to work over a generic path. Whether a display reading actually comes back on a
    return device is not measured. Read verified 2026-08-30 against Live 12.4.5 at
    song.return_tracks[0].devices[0].parameters through lom_describe: a ATimeableValueVector of
    33 element(s). No write, call, observation or automation was attempted on this row.
  params:
    - {name: return, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: return_device.parameter
  path: song.return_tracks[{return}].devices[{device}].parameters[{param}]
  access: [get, observe, automate]
  kind: float
  unit: normalized
  display: native
  destructive: false
  verify: read_back
  status: verified
  doc: >-
