    attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: simpler.sample_end_marker
  path: song.tracks[{track}].devices[{device}].sample.end_marker
  access: [get, set, observe]
  kind: int
  unit: none
  destructive: false
  verify: read_back
  status: verified
