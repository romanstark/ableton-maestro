    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}
    - {name: param, kind: int, required: true}

- id: param.automation_state
  path: song.tracks[{track}].devices[{device}].parameters[{param}].automation_state
  access: [get, observe]
  kind: enum
  enum: [0, 1, 2]
  range: [0, 2]
  unit: none
  destructive: false
  verify: none
  status: verified
  means:
    "0": >-
      none - no automation on this parameter
    "1": >-
      playing - automation is running
    "2": >-
      overridden - automation exists and a manual move is currently winning
  doc: >-
    Whether this parameter carries automation and whether it is currently being
    obeyed. `overridden` is the state that hides bugs: the envelope exists, the
    parameter has been touched, and playback ignores the curve until automation
    is re-enabled (see param.re_enable_automation). Measured and worth
    repeating here: an envelope belongs to a DEVICE, not to "the track's
    filter": it points at device index plus parameter index, so swapping a
    device orphans every curve on it. The build rule that follows is to put
    automation on a separate effect device (Auto Filter, Utility) rather than
    on the instrument's own filter, which was verified by swapping Wavetable
    for Jup-8 V4 with the automation running unchanged.
    Read verified 2026-08-30 against Live 12.4.5 at
    song.tracks[10].devices[3].parameters[0].automation_state through lom_describe: returned 0
    (int). No write, call, observation or automation was attempted on this row.
    Value names read off Live.DeviceParameter.AutomationState through the enum_names handler
    (docs/protocol.md section 5.12), measured 2026-08-31 against Live 12.4.5 - not transcribed
    from a reference. Cycling 74's LOM documentation agrees.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}
    - {name: param, kind: int, required: true}

- id: param.str_for_value
  path: song.tracks[{track}].devices[{device}].parameters[{param}]
  access: [call]
  method: str_for_value
  destructive: false
  verify: none
  status: verified
  doc: >-
    Ask the parameter what a given raw value would READ AS in the GUI. Args: [value].
    Returns a str such as "-12.0 dB" or "98.0 Hz". This is the clean way out of unit
    guessing: and it is also where the hardest limit sits: VST2 NEVER REPORTS UNITS.
    Measured across 214 automatable browser entries: VST2 0 of 36 with real units, VST3 89
    of 178. For a VST2 the reading is a bare number like "0.66", which is formally
    parseable and physically meaningless, so a display-driven search will happily walk the
    control to its end stop and report a near-1.0 relative error instead of raising.
    Calling str_for_value(min) and str_for_value(max) is the cheap way to find out whether
    a device says anything at all: and unlike a probing write, it moves nothing. Call
    verified 2026-08-30 against Live 12.4.5: invoked and it answered "0.50 dB". The call
    only reads; nothing in the set was changed.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}
    - {name: param, kind: int, required: true}

- id: param.re_enable_automation
  path: song.tracks[{track}].devices[{device}].parameters[{param}]
  access: [call]
  method: re_enable_automation
  destructive: false
  verify: none
  status: verified
  doc: >-
    Give an overridden parameter back to its automation curve: the API equivalent of Live's
    "Re-Enable Automation" button. Args: []. Use it after any write to a parameter that carries
    an envelope, otherwise the written value keeps winning over the curve for the rest of the
    session. Verify with param.automation_state going from overridden back to playing. Call
    verified 2026-08-30 against Live 12.4.5: invoked and it returned without error. The set was
    restored afterwards where the call had any effect.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}
    - {name: param, kind: int, required: true}

# =============================================================================
# RackDevice: Instrument / Audio Effect / MIDI Effect / Drum Rack
#   Guard every one of these with device.can_have_chains first.
# =============================================================================

- id: rack.chains
  path: song.tracks[{track}].devices[{device}].chains
  access: [get, observe]
  kind: list
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The rack's chains, in order. A rack with an empty chains list makes NO SOUND while
    every other check stays green: measured on a Drum Rack loaded from the browser: load
    reported success, the device chain showed DrumGroupDevice, the clips and notes were
    all correct, and the track was silent. Reading this list is the check that catches it.
    Raises on a non-rack device, so guard with device.can_have_chains.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: rack.return_chains
  path: song.tracks[{track}].devices[{device}].return_chains
  access: [get, observe]
  kind: list
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The rack's internal return chains: the sends inside a rack, most commonly used in Drum
    Racks to give every pad one shared reverb. Separate from the song's return tracks and from
    rack.chains. Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this
    row.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: rack.drum_pads
  path: song.tracks[{track}].devices[{device}].drum_pads
  access: [get, observe]
  kind: list
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    A Drum Rack's pads. The indexing is not measured here: the list holds all 128 pads and is
    indexed BY MIDI NOTE, so drum_pads[36] is the pad for note 36 (the usual kick), not the 36th
    filled pad. Most entries are empty pads with no chains. Guard with
    device.can_have_drum_pads. Cross-channel note: in the saved .als a drum branch stores
    <ReceivingNote> as 128 minus the note (measured: a kit on notes 36..51 writes 92..77,
    descending), while DrumPad.note here is the plain MIDI note. Do not apply that mirror twice.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: rack.visible_drum_pads
  path: song.tracks[{track}].devices[{device}].visible_drum_pads
  access: [get, observe]
  kind: list
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The 16 pads currently shown in the Drum Rack's 4x4 grid, which depends on the scroll
    position (see rack.view.drum_pads_scroll_position). This is a VIEW of rack.drum_pads, not a
    filter of the filled ones: do not use it to enumerate a kit. Read verified 2026-08-29
    against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: rack.has_drum_pads
  path: song.tracks[{track}].devices[{device}].has_drum_pads
  access: [get]
  kind: bool
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Whether the Drum Rack actually has any filled pads, as opposed to merely being able to have
    them (can_have_drum_pads). This is the one-property answer to "is this the empty Drum Rack
    container or a real kit": the measured silent-track case. What the flag reports on an empty
    rack is not measured, so also check that rack.chains is non-empty. Read verified 2026-08-29
    against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: rack.has_macro_mappings
  path: song.tracks[{track}].devices[{device}].has_macro_mappings
  access: [get, observe]
  kind: bool
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Whether any macro on this rack is mapped to anything. False means the macros are visible but
    inert: turning them does nothing, which reads exactly like a broken write. Read verified
    2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: rack.macros_mapped
  path: song.tracks[{track}].devices[{device}].macros_mapped
  access: [get, observe]
  kind: list
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Per-macro mapping flags: a list of bools, one per macro, telling which macros actually
    drive something. Not present on every Live version: expect no_such_path on older builds,
    which were not tested. Read verified 2026-08-29 against Live 12.4.5; a write was NOT
    attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: rack.visible_macro_count
  path: song.tracks[{track}].devices[{device}].visible_macro_count
  access: [get, set, observe]
  kind: int
  range: [0, 16]
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    How many macro knobs the rack shows. Live 11 introduced a variable count (1..16); Live 10
    and earlier always had exactly 8. Setting it lower than the number of mapped macros hides
    mappings without deleting them. The upper bound of 16 is expected rather than measured. Read
    verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: rack.chain_selector
  path: song.tracks[{track}].devices[{device}].chain_selector
  access: [get, set, observe, automate]
  kind: float
  range: [0.0, 127.0]
  unit: none
  display: native
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    The rack's Chain Selector, as a DeviceParameter: the 0..127 position that decides which
    chains are active through their zone settings. This is how a single rack becomes a
    switchable multi-instrument, and it automates like any other parameter. Not present on a
    Drum Rack. The 0..127 range is expected rather than measured: read rack-specific min/max
    via the parameter's own .min and .max before ramping. Read verified 2026-08-29 against Live
    12.4.5 on a populated rack (808 Boom Kit inside an Instrument Rack; Disharmonics inside an
    Audio Effect Rack). A write was NOT attempted.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: rack.macro
  path: song.tracks[{track}].devices[{device}].parameters[{macro}]
  access: [get, observe, automate]
  kind: float
  range: [0.0, 127.0]
  unit: none
  display: native
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    One macro knob of a rack, addressed through the rack's own parameter list. Macro 1 is
    parameters[1], because parameters[0] is "Device On": so macro N is index N. Macros
    are the one place where a single write moves several nested parameters at once, and
    the nested parameters then report is_enabled = False. Live shows macros as 0..127 with
    a percentage display; the raw range is expected rather than measured, so read
    .min/.max first.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
    Measured 2026-08-29 against Live 12.4.5: this path resolves to the DeviceParameter
    OBJECT. It is the correct target for automation_write's 'parameter' argument, and
    lom_get on it still carries 'display'. It is NOT writable - lom_set answers
    not_settable. To write the number, use the companion 'rack.macro_value' row, whose
    path ends in .value.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}
    - {name: macro, kind: int, required: true}

- id: rack.macro_name
  path: song.tracks[{track}].devices[{device}].parameters[{macro}].name
  access: [get]
  kind: str
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    A macro's current label. Read-only here: the LOM's supported way to change it is
    rack.rename_macro. Assigning to .name directly is not reliable. Use original_name
    ("Macro 1") when you need a stable key.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}
    - {name: macro, kind: int, required: true}

- id: rack.rename_macro
  path: song.tracks[{track}].devices[{device}]
  access: [call]
  method: rename_macro
  destructive: false
  verify: none
  status: verified
  doc: >-
    Rename a macro knob. Args: [macro_index, new_name] with macro_index 0-based over the macros
    (0 is Macro 1, i.e. parameters[1]). Availability is version dependent, and older builds were
    not tested. Verify by reading rack.macro_name. Read verified 2026-08-29 against Live 12.4.5
    on a populated rack (808 Boom Kit inside an Instrument Rack; Disharmonics inside an Audio
    Effect Rack). A write was NOT attempted.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: rack.add_macro
  path: song.tracks[{track}].devices[{device}]
  access: [call]
  method: add_macro
  destructive: false
  verify: none
  status: verified
  doc: >-
    Show one more macro knob (Live 11+, up to 16). Args: []. Verify by reading
    rack.visible_macro_count. Read verified 2026-08-29 against Live 12.4.5 on a populated rack
    (808 Boom Kit inside an Instrument Rack; Disharmonics inside an Audio Effect Rack). A write
    was NOT attempted.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: rack.remove_macro
  path: song.tracks[{track}].devices[{device}]
  access: [call]
  method: remove_macro
  destructive: true
  verify: none
  status: verified
  doc: >-
    Hide the last macro knob (Live 11+). Args: []. Destructive: removing a macro that carries
    mappings discards those mappings, and there is no way to put them back other than undo. Read
    verified 2026-08-29 against Live 12.4.5 on a populated rack (808 Boom Kit inside an
    Instrument Rack; Disharmonics inside an Audio Effect Rack). A write was NOT attempted.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: rack.macro_map
  path: song.tracks[{track}].devices[{device}]
  access: [call]
  method: macro_map
  destructive: false
  verify: none
  status: verified
  doc: >-
    Map a nested device's parameter onto a macro. Args: [macro_index, parameter]: the second
    argument is a DeviceParameter object, not a name or an index, so the caller must hand the
    script a resolvable path rather than a JSON scalar. One use for it: a single macro that
    drives the same parameter across every chain of a rack at once. Availability is version
    dependent, and older builds were not tested. After mapping, the nested parameter reports
    is_enabled = False. Read verified 2026-08-29 against Live 12.4.5 on a populated rack (808
    Boom Kit inside an Instrument Rack; Disharmonics inside an Audio Effect Rack). A write was
    NOT attempted.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: rack.variation_count
  path: song.tracks[{track}].devices[{device}].variation_count
  access: [get, observe]
  kind: int
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    How many macro variations (Live 11+ snapshots of all macro positions) this rack has stored.
