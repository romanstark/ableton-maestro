- id: drum_pad.name
  path: song.tracks[{track}].devices[{device}].drum_pads[{pad}].name
  access: [get, observe]
  kind: str
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The pad's label: in practice the name of the sample or chain sitting on it. Expected to be
    READ-ONLY on DrumPad, which is not measured; to relabel a pad, write drum_pad.chain_name on
    its chain instead. An empty pad reports an empty name. Read verified 2026-08-29 against Live
    12.4.5; a write was NOT attempted on this row. KNOWN STRUCTURE, not a probe of this row: a
    real drum kit preset (808 Boom Kit.adg, from a Pack) loads as an InstrumentGroupDevice that
    WRAPS the DrumGroupDevice - the drum rack sits at devices[i].chains[0].devices[0], not at
    devices[i]. This path only resolves for a bare Drum Rack device. Loading the same kit by
    drag and by load_item both nest it, so the nesting belongs to the preset, not to how it was
    loaded.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}
    - {name: pad, kind: int, required: true}

- id: drum_pad.note
  path: song.tracks[{track}].devices[{device}].drum_pads[{pad}].note
  access: [get]
  kind: int
  range: [0, 127]
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The MIDI note that triggers this pad: plain, unmirrored, and equal to the pad's index
    in rack.drum_pads. Read-only. The mirroring trap is a channel-B one: in the saved file
    the branch stores its ReceivingNote as 128 minus the note (measured: a 909 kit's pads
    on 36, 38, 39, 42 appear there as 92, 90, 89, 86). Reading the raw file value as a
    MIDI note puts the kick on a note no drum kit plays; the LOM value here needs no such
