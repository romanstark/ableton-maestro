- id: return_device.is_active
  path: song.return_tracks[{return}].devices[{device}].is_active
  access: [get, observe]
  kind: bool
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Read-only on/off state of a return-track device. Write return_device.on instead.
    Read verified 2026-08-30 against Live 12.4.5 at song.return_tracks[0].devices[0].is_active
