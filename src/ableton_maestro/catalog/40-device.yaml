  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: simpler.sample_slicing_beat_division
  path: song.tracks[{track}].devices[{device}].sample.slicing_beat_division
  access: [get, set, observe]
  kind: float
  unit: beats
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    The grid used when slicing by beat rather than by transient. Only in effect when the slicing
