# =============================================================================
# Sampler: class_name "MultiSampler"
#
#   EVERY ROW IN THIS BLOCK IS A HYPOTHESIS, AND MOST OF THEM ARE EXPECTED TO
#   FAIL. The LOM gives Simpler a dedicated class; Sampler, as far as this
#   author can tell, gets none, which would mean its zones, sample layers, key
#   and velocity ranges and modulation matrix are NOT reachable at all: only
#   the flat parameters[] list is. That is a real gap and it belongs in
#   docs/limits.md if it is confirmed.
#
#   The rows are here rather than omitted because probe_paths.py exists to
#   settle exactly this kind of question, and a missing row cannot be probed
#   (docs/architecture.md, "the catalog"). Expect no_such_path on all of them.
# =============================================================================

- id: sampler.parameter_by_name
  path: song.tracks[{track}].devices[{device}].parameters[{param}].name
  access: [get]
  kind: str
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The fallback that is expected to work where the rows above do not: a
    Sampler is still a Device, so its exposed controls are in parameters[] with
    names, ranges and str_for_value() like any other. Walk device.parameters
    and match names. This is the honest ceiling for Sampler until a probe says
    otherwise.
    Read verified 2026-08-30 against Live 12.4.5 at
    song.tracks[10].devices[3].parameters[0].name through lom_describe: returned 'Device On'
    (string). No write, call, observation or automation was attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}
    - {name: param, kind: int, required: true}

