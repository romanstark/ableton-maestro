- id: param.is_quantized
  path: song.tracks[{track}].devices[{device}].parameters[{param}].is_quantized
  access: [get]
  kind: bool
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Whether the parameter steps rather than sweeps. NOT EVERY 0..1 PARAMETER IS CONTINUOUS
    (measured): on third-party plugins measured here, a preamp's EQ frequency controls had four
