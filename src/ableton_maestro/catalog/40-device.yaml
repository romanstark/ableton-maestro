    - {name: device, kind: int, required: true}
    - {name: param, kind: int, required: true}

- id: param.value_items
  path: song.tracks[{track}].devices[{device}].parameters[{param}].value_items
  access: [get]
  kind: list
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The labels of a quantized parameter's steps, in index order: the only way
    to learn what step 7 of 12 actually means. Empty or absent on continuous
