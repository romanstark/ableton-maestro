    automation_write's 'parameter' argument, and lom_get on it still carries 'display'. It
    is NOT writable - lom_set answers not_settable. To write the number, use the companion
    'return_device.parameter_value' row, whose path ends in .value.
    Read verified 2026-08-30 against Live 12.4.5 at song.return_tracks[0].devices[0].parameters
    through lom_describe: a ATimeableValueVector of 33 element(s). No write, call, observation
    or automation was attempted on this row.
  params:
    - {name: return, kind: int, required: true}
    - {name: device, kind: int, required: true}
    - {name: param, kind: int, required: true}

