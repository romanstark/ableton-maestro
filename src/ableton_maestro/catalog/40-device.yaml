    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: simpler.sample_warping
  path: song.tracks[{track}].devices[{device}].sample.warping
  access: [get, set, observe]
  kind: bool
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    Whether the sample follows the song tempo. The clip-level equivalent (clip.warping) is one
    of the three paths that decide whether this whole architecture holds (docs/architecture.md,
    "the restart tax"); this is its Simpler counterpart. Measured context worth carrying: Live's
    warp analysis is asynchronous, so reading warping or its markers immediately after importing
    audio reads a half-finished state. Read verified 2026-08-29 against Live 12.4.5; a write was
    NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: simpler.sample_warp_mode
  path: song.tracks[{track}].devices[{device}].sample.warp_mode
  access: [get, set, observe]
  kind: enum
  enum: [0, 1, 2, 3, 4, 5, 6]
  range: [0, 6]
  unit: none
  destructive: false
  verify: read_back
  status: verified
  means:
    "0": >-
      beats
    "1": >-
      tones
    "2": >-
      texture
    "3": >-
      repitch
    "4": >-
      complex
    "5": >-
      rex
    "6": >-
      complex_pro
  doc: >-
    Which warp algorithm the sample uses. The wire value is the integer index; this ordering
    follows the LOM's WarpMode and has not been measured. Note that `rex` is not selectable for
