    12.4.5; a write was NOT attempted on this row.
    Value names read off Live.Clip.WarpMode through the enum_names handler (docs/protocol.md
    section 5.12), measured 2026-08-31 against Live 12.4.5 - not transcribed from a reference.
    Cycling 74's LOM documentation agrees.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

