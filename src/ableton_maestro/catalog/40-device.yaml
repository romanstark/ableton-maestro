    no unit conversion is needed and none is possible.
    Read verified 2026-08-30 against Live 12.4.5 at
    song.tracks[10].devices[3].parameters[0].value_items through lom_describe: a StringVector of
    2 element(s). No write, call, observation or automation was attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}
    - {name: param, kind: int, required: true}

- id: param.state
  path: song.tracks[{track}].devices[{device}].parameters[{param}].state
  access: [get, observe]
  kind: enum
  enum: [0, 1, 2]
  range: [0, 2]
  unit: none
  destructive: false
  verify: none
  status: verified
  means:
    "0": >-
      enabled
    "1": >-
      irrelevant - present, but has no effect in the mode the device is in
    "2": >-
      disabled
  doc: >-
    Why a parameter cannot be written, in more detail than is_enabled: `irrelevant` means the
    current device configuration makes it meaningless (a filter's resonance while the filter is
    bypassed), `disabled` means something else drives it. Wire value is the integer index; this
    ordering follows the LOM's ParameterState and has not been measured. Read verified
    2026-08-30 against Live 12.4.5 at song.tracks[10].devices[3].parameters[0].state through
    lom_describe: returned 0 (int). No write, call, observation or automation was attempted on
    this row.
    Value names read off Live.DeviceParameter.ParameterState through the enum_names handler
    (docs/protocol.md section 5.12), measured 2026-08-31 against Live 12.4.5 - not transcribed
    from a reference. Cycling 74's LOM documentation agrees.
