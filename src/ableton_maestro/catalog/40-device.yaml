# =============================================================================
# Chain: one branch inside a rack
#   Live.Chain.Chain. A chain is very nearly a track: it has a name, a colour,
#   mute/solo, its own device list and its own mixer.
# =============================================================================

- id: chain.name
  path: song.tracks[{track}].devices[{device}].chains[{chain}].name
  access: [get, set, observe]
  kind: str
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    The chain's name, as shown in the rack's chain list. Writable. For a Drum Rack chain
    this is what the pad shows, so renaming here renames the pad label in the GUI.
    Read verified 2026-08-29 against Live 12.4.5 on a populated rack (808 Boom Kit inside
    an Instrument Rack; Disharmonics inside an Audio Effect Rack). A write was NOT
    attempted.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}
    - {name: chain, kind: int, required: true}

- id: chain.color
  path: song.tracks[{track}].devices[{device}].chains[{chain}].color
  access: [get, set, observe]
  kind: int
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    The chain's colour as a packed 0xRRGGBB integer. Live snaps an arbitrary value to the
    nearest entry of its fixed palette, so the read-back will often differ from what was
    requested: that is a snap, not a failure, and lom_set reports it as `clamped`
    (docs/protocol.md §5.4). Writing also turns chain.is_auto_colored off.
    Read verified 2026-08-29 against Live 12.4.5 on a populated rack (808 Boom Kit inside
    an Instrument Rack; Disharmonics inside an Audio Effect Rack). A write was NOT
    attempted.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}
    - {name: chain, kind: int, required: true}

- id: chain.color_index
  path: song.tracks[{track}].devices[{device}].chains[{chain}].color_index
  access: [get, set, observe]
  kind: int
  range: [0, 69]
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    The chain's colour as an index into Live's palette rather than as RGB. Safer than
    chain.color because there is no snapping. The upper bound of 69 matches Live's
    70-swatch palette and is expected rather than measured.
    Read verified 2026-08-29 against Live 12.4.5 on a populated rack (808 Boom Kit inside
    an Instrument Rack; Disharmonics inside an Audio Effect Rack). A write was NOT
    attempted.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}
    - {name: chain, kind: int, required: true}

- id: chain.is_auto_colored
  path: song.tracks[{track}].devices[{device}].chains[{chain}].is_auto_colored
  access: [get, set, observe]
  kind: bool
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    Whether Live picks the chain's colour itself. Writing chain.color or chain.color_index sets
    this to false as a side effect; setting it back to true discards the manual colour. Read
    verified 2026-08-29 against Live 12.4.5 on a populated rack (808 Boom Kit inside an
    Instrument Rack; Disharmonics inside an Audio Effect Rack). A write was NOT attempted.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}
    - {name: chain, kind: int, required: true}

- id: chain.mute
  path: song.tracks[{track}].devices[{device}].chains[{chain}].mute
  access: [get, set, observe]
  kind: bool
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    Mute one chain of a rack. Note the inversion trap this shares with tracks: mute = true
    means SILENT. A chain silenced by another chain's solo reports mute = false and
    muted_via_solo = true: two different states that sound the same.
    Read verified 2026-08-29 against Live 12.4.5 on a populated rack (808 Boom Kit inside
    an Instrument Rack; Disharmonics inside an Audio Effect Rack). A write was NOT
    attempted.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}
    - {name: chain, kind: int, required: true}

- id: chain.solo
  path: song.tracks[{track}].devices[{device}].chains[{chain}].solo
  access: [get, set, observe]
  kind: bool
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    Solo one chain of a rack. Scoped to this rack, not to the song. Soloing a chain
    silences its siblings without changing their own mute flags: read
    chain.muted_via_solo to tell the two apart. Leaving a solo on is the classic reason a
    later bounce is missing parts.
    Read verified 2026-08-29 against Live 12.4.5 on a populated rack (808 Boom Kit inside
    an Instrument Rack; Disharmonics inside an Audio Effect Rack). A write was NOT
    attempted.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}
    - {name: chain, kind: int, required: true}

- id: chain.muted_via_solo
  path: song.tracks[{track}].devices[{device}].chains[{chain}].muted_via_solo
  access: [get, observe]
  kind: bool
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    True when this chain is silent only because a sibling is soloed. Read-only. This is the
    property that stops "the chain is muted" from being a wrong diagnosis. Read verified
    2026-08-29 against Live 12.4.5 on a populated rack (808 Boom Kit inside an Instrument Rack;
    Disharmonics inside an Audio Effect Rack). A write was NOT attempted.
  params:
