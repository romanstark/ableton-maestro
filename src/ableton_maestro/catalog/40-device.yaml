- id: eq8.frequency_hint
  path: song.tracks[{track}].devices[{device}].parameters[{param}]
  access: [get, observe, automate]
  kind: float
  range: [0.0, 1.0]
  unit: normalized
  display: hz
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    An EQ Eight or Auto Filter frequency, written as a normalised value. Listed separately
    from param.value because its scale IS known and measured, unlike a plugin's: 0..1 maps
    logarithmically over 20 Hz .. 20 kHz, so norm = log10(hz / 20) / 3 and hz = 20 * 10 **
    (3 * norm). Verified against two pairs read out of the project file: 18939 Hz gives
    0.9921 and 13692 Hz gives 0.9451. DO NOT use the 30 Hz variant found in other scripts:
    aiming at 100 Hz with it lands on 71.9 Hz, 572 cents off, with no error message: and
    filter sweeps live at exactly that end of the range. The parameter index is not fixed;
    find it by name in device.parameters. This path resolves to the DeviceParameter
    OBJECT. It is the correct target for automation_write's 'parameter' argument, and
    lom_get on it still carries 'display'. It is NOT writable - lom_set answers
    not_settable. To write the number, use the companion 'eq8.frequency_hint_value' row,
    whose path ends in .value.
    Read verified 2026-08-30 against Live 12.4.5 at song.tracks[10].devices[3].parameters
    through lom_describe: a ATimeableValueVector of 84 element(s). No write, call, observation
    or automation was attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}
    - {name: param, kind: int, required: true}

