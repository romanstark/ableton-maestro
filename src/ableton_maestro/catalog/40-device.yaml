    write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: device, kind: int, required: true}

- id: rack.selected_variation_index
  path: song.tracks[{track}].devices[{device}].selected_variation_index
  access: [get, set, observe]
  kind: int
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    Which macro variation is selected. Selecting is not recalling: writing this moves the
    selection, and rack.recall_selected_variation is what actually applies the stored macro
