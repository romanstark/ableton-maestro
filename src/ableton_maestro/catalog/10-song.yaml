  kind: list
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    All tracks in the set, in order, as handles; return tracks and the master are not in
    this list. Indices here are what every track.* row's {track} parameter means. Measured
    trap: iterating this list unguarded raises at the first group track, because groups
    have no arm state and no arrangement clips - check can_be_armed and is_foldable before
    touching either (docs/protocol.md section 6). And grouping tracks in the
    GUI renumbers everything after the group, so re-read this list rather than caching
    indices.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.

