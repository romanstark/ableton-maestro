  doc: >-
    The locators in the arrangement, as handles. What Live's UI calls a Locator is a
    CuePoint in the LOM - see the cue.* rows for their properties. Read-only as a list:
    locators are created with song.set_or_delete_cue, not by appending here. Sorted by
    time, expected but unverified.
