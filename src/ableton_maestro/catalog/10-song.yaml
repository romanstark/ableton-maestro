  kind: object
  unit: none
  destructive: true
  verify: none
  status: verified
  doc: >-
    Toggle a locator at the current playhead: creates one if there is none there, deletes the
    existing one if there is. Returns nothing; confirm by reading song.cue_points. Marked
    destructive because it is a toggle - calling it twice is not idempotent, it removes what the
    first call made. Set song.current_song_time first; there is no position argument. Call
    verified 2026-08-30 against Live 12.4.5, on a scratch track created and deleted for the
    purpose. It ran and did what it says.

- id: song.jump_to_next_cue
