    Tracks currently visible, i.e. song.tracks minus the ones hidden inside folded groups.
    The indices here do NOT match song.tracks indices, and using one where the other is
    meant addresses the wrong track while reporting success. Every {track} parameter in
    this catalog means a song.tracks index.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.

