# CuePoint - song.cue_points[{cue}]
# ---------------------------------------------------------------------------

- id: cue.name
  path: song.cue_points[{cue}].name
  access: [get, set, observe]
  kind: str
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    Locator name. Live names new locators automatically ("Locator 1", ...) and renaming is
    the point of having them - section markers a human can read are what makes an
    arrangement navigable.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: cue, kind: int, required: true}

- id: cue.time
  path: song.cue_points[{cue}].time
  access: [get, observe]
  kind: float
  unit: beats
  destructive: false
  verify: none
  status: verified
  doc: >-
    Position of the locator in beats from the start of the arrangement. Read-only: a
    locator cannot be moved through the LOM. To place one somewhere else, set
    song.current_song_time, call song.set_or_delete_cue to create the new one, and toggle
    the old one away.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: cue, kind: int, required: true}

- id: cue.jump
  path: song.cue_points[{cue}]
  access: [call]
  method: jump
  kind: object
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Move the playhead to this locator. Returns nothing; confirm with
    song.current_song_time, which should then equal cue.time. While the transport
    is running the jump is expected to obey launch quantisation rather than
    happening instantly - unverified.
    Call verified 2026-08-30 against Live 12.4.5: a locator was created at beat 8 with
    song.set_or_delete_cue, jump() called on it, and song.current_song_time read back 8. The
    locator was deleted again.
  params:
    - {name: cue, kind: int, required: true}

- id: app.zoom_view
  path: app.view
  access: [call]
  method: zoom_view
  kind: object
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Zoom a named view in or out by one step. Purely cosmetic for the audio, but it
    decides what a human sees when they look at the screen after a batch has run.
    Returns nothing. Measured 2026-08-29 against Live 12.4.5: called as
    zoom_view(1, "Arranger", False) on app.view and accepted. The view name must be
    one of app.available_main_views, which reported Browser, Arranger, Session,
    Detail, Detail/Clip and Detail/DeviceChain on that install. The direction and
    the third argument were NOT varied, so their exact meaning is not measured; the
    LOM documents them as (direction, view_name, modifier).
  args:
    - {name: direction, kind: int, required: true,
       doc: "Zoom step. 1 and 0 were the values tried; the sign convention is unverified."}
    - {name: view_name, kind: str, required: true,
       doc: "One of app.available_main_views."}
    - {name: modifier, kind: bool, required: false, default: false,
       doc: "Passed as False in the measurement; its effect is unverified."}

- id: app.scroll_view
  path: app.view
  access: [call]
  method: scroll_view
  kind: object
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Scroll a named view by one step. Same shape and the same caveats as
    app.zoom_view. Measured 2026-08-29 against Live 12.4.5: called as
    scroll_view(0, "Arranger", False) on app.view and accepted; returns nothing.
    The direction convention and the third argument are unverified.
  args:
    - {name: direction, kind: int, required: true,
       doc: "Scroll step. 0 was the value tried; the sign convention is unverified."}
    - {name: view_name, kind: str, required: true,
       doc: "One of app.available_main_views."}
    - {name: modifier, kind: bool, required: false, default: false,
       doc: "Passed as False in the measurement; its effect is unverified."}

