    confirm with song.current_song_time. A no-op past the last locator, expected but
    unverified. Call verified 2026-08-30 against Live 12.4.5:
    invoked and it returned without error. The set was restored afterwards where the call
    had any effect.

- id: song.jump_to_prev_cue
