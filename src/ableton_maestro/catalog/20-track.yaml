# ---------------------------------------------------------------------------
# Track mixer - MixerDevice on a normal track
# ---------------------------------------------------------------------------

- id: track.volume
  path: song.tracks[{track}].mixer_device.volume
  access: [get, observe, automate]
  kind: float
  range: [0.0, 1.0]
  unit: normalized
  display: db
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    Track fader. The raw value is normalised 0..1 and the scale is NOT linear: measured,
    0.85 is 0 dB, and above 0.62 the fader is exactly linear in dB with dB = (normalized -
    0.85) * 40 - checked against 19 tracks with zero deviation. Below 0.62 the curve
    steepens and that formula stops holding. Three numbers exist for this one control and
    all look plausible: the .als stores a linear factor where 1.0 is 0 dB, the LOM uses
    0.85, and the display string says "0.00 dB" (measured). Reading the .als number as a
    LOM value diagnoses an overload that does not exist. Use the display value from
    str_for_value() when a human is meant to understand the number. Automation lives only
    in session clips (measured).
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
    Measured 2026-08-29 against Live 12.4.5: this path resolves to the DeviceParameter
    OBJECT. It is the correct target for automation_write's 'parameter' argument, and
    lom_get on it still carries 'display'. It is NOT writable - lom_set answers
    not_settable. To write the number, use the companion 'track.volume_value' row, whose
    path ends in .value.
  params:
    - {name: track, kind: int, required: true}

- id: track.panning
  path: song.tracks[{track}].mixer_device.panning
  access: [get, observe, automate]
  kind: float
  range: [-1.0, 1.0]
  unit: normalized
  display: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    Track pan, -1.0 hard left through 0.0 centre to 1.0 hard right. It has a display
    string, but that string is "50L" / "C" / "50R" and carries no numeric unit, which is
    why display is none rather than percent. Note this is Live's pan control, not a stereo
    widener - a bit-identical double panned apart is comb filtering, not width (measured).
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
    Measured 2026-08-29 against Live 12.4.5: this path resolves to the DeviceParameter
    OBJECT. It is the correct target for automation_write's 'parameter' argument, and
    lom_get on it still carries 'display'. It is NOT writable - lom_set answers
    not_settable. To write the number, use the companion 'track.panning_value' row, whose
    path ends in .value.
  params:
    - {name: track, kind: int, required: true}

- id: track.panning_mode
  path: song.tracks[{track}].mixer_device.panning_mode
  access: [get, set, observe]
  kind: enum
  enum: [0, 1]
  unit: none
  destructive: false
  verify: read_back
  status: verified
  means:
    "0": >-
      stereo - the single Pan control is the live one
    "1": >-
      split stereo - the two separate Left/Right Split Stereo controls are the live ones
  doc: >-
    Stereo pan mode: 0 the normal pan knob, 1 split stereo pan. Live 11 and later; the
    enum order is not measured. In split mode track.panning is ignored and
    track.left_split_stereo / track.right_split_stereo take over - a pan write that reads
    back correctly and does nothing audible is explained here.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
    Measured 2026-08-29 against Live 12.4.5: this is a plain int property, not a
    DeviceParameter - lom_set writes it directly and there is no .value below it.
    Which value is which was MEASURED rather than read anywhere, because Live exposes no enum
    type for this property - checked in the running interpreter and in Live's own
    _MxDCore/LomTypes on 2026-08-31, neither has one. The measurement uses the mixer's own
    answer: at panning_mode 0, panning.state is enabled and both split_stereo states are
    irrelevant; at 1 that flips exactly, both ways round, and the track was restored. 'enabled'
    and 'irrelevant' are themselves read off Live.DeviceParameter.ParameterState, so the chain
    is measurement all the way down.

  params:
    - {name: track, kind: int, required: true}

- id: track.left_split_stereo
  path: song.tracks[{track}].mixer_device.left_split_stereo
  access: [get, observe, automate]
  kind: float
  range: [-1.0, 1.0]
  unit: normalized
  display: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    Position of the left channel in split stereo pan mode. Only in effect when
    track.panning_mode is 1.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
    Measured 2026-08-29 against Live 12.4.5: this path resolves to the DeviceParameter
    OBJECT. It is the correct target for automation_write's 'parameter' argument, and
    lom_get on it still carries 'display'. It is NOT writable - lom_set answers
    not_settable. To write the number, use the companion 'track.left_split_stereo_value'
    row, whose path ends in .value.
  params:
    - {name: track, kind: int, required: true}

- id: track.right_split_stereo
  path: song.tracks[{track}].mixer_device.right_split_stereo
  access: [get, observe, automate]
  kind: float
  range: [-1.0, 1.0]
  unit: normalized
  display: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    Position of the right channel in split stereo pan mode. Only in effect when
    track.panning_mode is 1.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
    Measured 2026-08-29 against Live 12.4.5: this path resolves to the DeviceParameter
    OBJECT. It is the correct target for automation_write's 'parameter' argument, and
    lom_get on it still carries 'display'. It is NOT writable - lom_set answers
    not_settable. To write the number, use the companion 'track.right_split_stereo_value'
    row, whose path ends in .value.
  params:
    - {name: track, kind: int, required: true}

- id: track.track_activator
  path: song.tracks[{track}].mixer_device.track_activator
  access: [get, observe, automate]
  kind: float
  range: [0.0, 1.0]
  unit: normalized
  display: none
  quantized: true
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    The mixer's on/off switch - the same state as track.mute, inverted (1 is on, 0 is
    off). Quantized, so anything below 0.5 rounds to 0 and anything above rounds to 1:
    measured on a related bug, a value of 0.25 sent at a quantized parameter reads back as
    0.0 and the device ends up switched off while the response reports success.
    Prefer track.mute when the intent is muting; use this one when the
    intent is automating the switch, since it is a DeviceParameter and track.mute is not.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
    Measured 2026-08-29 against Live 12.4.5: this path resolves to the DeviceParameter
    OBJECT. It is the correct target for automation_write's 'parameter' argument, and
    lom_get on it still carries 'display'. It is NOT writable - lom_set answers
    not_settable. To write the number, use the companion 'track.track_activator_value'
    row, whose path ends in .value.
  params:
    - {name: track, kind: int, required: true}

- id: track.crossfade_assign
  path: song.tracks[{track}].mixer_device.crossfade_assign
  access: [get, set, observe]
  kind: enum
  enum: [0, 1, 2]
  unit: none
  destructive: false
  verify: read_back
  status: verified
  means:
    "0": >-
      A - assigned to the crossfader's A side
    "1": >-
      none - not assigned, so the crossfader does not affect this track. This is also the value
      every untouched track and return reads
    "2": >-
      B - arithmetic, not a separate reading: three integers, three labels, 0 and 1 both
      measured
  doc: >-
    Crossfader assignment: 0 A, 1 none, 2 B. Note that the middle value is "none", so this is
    not an A/B toggle and 1 is not B. A plain integer property on the mixer, not a
    DeviceParameter, so it has no display value and cannot be automated. Read verified
    2026-08-29 against Live 12.4.5; a write was NOT attempted on this row. Measured 2026-08-29
    against Live 12.4.5: this is a plain int property, not a DeviceParameter - lom_set writes it
    directly and there is no .value below it. The value names were MEASURED 2026-08-31 against
    Live 12.4.5: at 0 the track showed 'A' lit, and at 1 neither A nor B was lit. That leaves
    'B' for 2 by arithmetic. Live exposes no enum type for this property. The track was
    restored.

  params:
    - {name: track, kind: int, required: true}

- id: track.sends
  path: song.tracks[{track}].mixer_device.sends
  access: [get, observe]
  kind: list
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The track's send parameters, as handles, one per return track and in the same order as
    song.return_tracks. Read-only as a list: the length changes only when a return track
    is created or deleted, and both operations invalidate every send index captured
    beforehand.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.send
  path: song.tracks[{track}].mixer_device.sends[{send}]
  access: [get, observe, automate]
  kind: float
  range: [0.0, 1.0]
  unit: normalized
  display: db
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    One send level. The send curve is NOT the fader curve: measured, a normalised 0.699 is
    -12 dB on a send but -6 dB on the volume fader, so planning send levels in 0..1 is
