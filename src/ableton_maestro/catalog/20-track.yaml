# ---------------------------------------------------------------------------
# Track - content, collections, meters
# ---------------------------------------------------------------------------

- id: track.clip_slots
  path: song.tracks[{track}].clip_slots
  access: [get, observe]
  kind: list
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The session clip slots of this track, one per scene, as handles. Its length is the
    number of scenes: a fresh set has eight, and slot 8 raises "Clip index out of range"
    until song.create_scene has been called (measured). Every index is bounds-checked
    before use, because an IndexError inside Live's process is a dead socket
    (docs/protocol.md section 6).
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.arrangement_clips
  path: song.tracks[{track}].arrangement_clips
  access: [get, observe]
  kind: list
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The clips on this track's arrangement timeline, as handles. Measured: group, return
    and master tracks have none and raise "Main, Group and Return Tracks have no
    arrangement clips" - an unguarded sweep over song.tracks breaks at the first group.
    Guard with track.is_foldable and track.can_be_armed. Note also that clip
    automation lives only in session clips: clip.automation_envelope() returns None here
    (measured).
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.devices
  path: song.tracks[{track}].devices
  access: [get, observe]
  kind: list
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The device chain, in order, as handles. What each device exposes as parameters is the
    dynamic surface and cannot be catalogued - use lom_describe (docs/protocol.md section
    5.6). Measured limit behind that: a VST shows only what has been picked up into Live's
    parameter strip via Configure, so a device reporting nothing but "Device On" is
    unconfigured, not unautomatable. Device order CAN be corrected afterwards with
    song.move_device (measured 2026-08-30 against Live 12.4.5), which is worth saying
    because the opposite is widely assumed.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.mixer_device
  path: song.tracks[{track}].mixer_device
  access: [get]
  kind: object
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The track's mixer, as a handle. Its parameters are catalogued individually below
    (volume, panning, track_activator, sends). Measured aside: reached as parameters this
    way a send does report a dB display_value, which is what makes a dB target searchable
    at all - a bare normalised send level carries no unit.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.playing_slot_index
  path: song.tracks[{track}].playing_slot_index
  access: [get, observe]
  kind: int
  unit: none
  destructive: false
  verify: none
  status: verified
  means:
    "-1": >-
      nothing is playing here. Correct and not a failure: with clip_trigger_quantization set
      to a bar, a read straight after firing still says -1
    "-2": >-
      read on every track immediately after stop(), measured 2026-08-31 against Live 12.4.5.
      The LOM calls this stopping; whether it differs from -1 in practice is NOT established
  doc: >-
    Index of the session clip currently playing on this track, or -1 when none is. Read-
    only. This is the honest answer to "did the clip actually start" - with
    song.clip_trigger_quantization set to a bar, a read straight after firing still shows
    -1 and that is correct, not a failure. The -2 value is expected to mean the track is
    stopping; that reading comes from the LOM and is not measured.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.fired_slot_index
  path: song.tracks[{track}].fired_slot_index
  access: [get, observe]
  kind: int
  unit: none
  destructive: false
  verify: none
  status: verified
  means:
    "-1": >-
      nothing is pending. Pair this with playing_slot_index: fired, then playing, and the gap
      between them is the quantisation wait
    "-2": >-
      the track's stop button was fired. Taken from the LOM convention, NOT measured
  doc: >-
    Index of the slot that has been fired but has not started yet, -1 when nothing is
    pending and -2 when the track's stop button was fired. Read-only. The pair
    (fired_slot_index, playing_slot_index) is the whole launch state machine: fired then
    playing, and the gap between them is the quantisation wait. The -2 convention is taken
    from the LOM and is not measured.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.input_meter_level
  path: song.tracks[{track}].input_meter_level
  access: [get, observe]
  kind: float
  range: [0.0, 1.0]
  unit: normalized
  destructive: false
  verify: none
  status: verified
  doc: >-
    Current input meter level, normalised, not dB. Read-only and instantaneous: over a
    strictly serial protocol each read is one round trip, so polling gives a sparse and
    jittery sample of a signal that moves at audio rate. Useful for "is anything arriving
    at all", useless as a measurement (docs/protocol.md section 3).
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.output_meter_level
  path: song.tracks[{track}].output_meter_level
  access: [get, observe]
  kind: float
  range: [0.0, 1.0]
  unit: normalized
  destructive: false
  verify: none
  status: verified
  doc: >-
    Current output meter level, normalised. Same sampling caveat as
    track.input_meter_level. It answers "is this track making sound right now", which no
    read-back of a parameter value can (docs/protocol.md section 10) - but only while the
    transport is running and only at the instant of the read.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.output_meter_left
  path: song.tracks[{track}].output_meter_left
  access: [get, observe]
  kind: float
  range: [0.0, 1.0]
  unit: normalized
  destructive: false
  verify: none
  status: verified
  doc: >-
    Left channel of the output meter, normalised. Read-only. Comparing left against right
    is the only stereo information the LOM offers - and a bit-identical double is comb
    filtering, not width (measured), so two equal meters prove very little.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.output_meter_right
  path: song.tracks[{track}].output_meter_right
  access: [get, observe]
  kind: float
  range: [0.0, 1.0]
  unit: normalized
  destructive: false
  verify: none
  status: verified
  doc: >-
    Right channel of the output meter, normalised. Read-only; see track.output_meter_left.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.input_meter_left
  path: song.tracks[{track}].input_meter_left
  access: [get, observe]
  kind: float
  range: [0.0, 1.0]
  unit: normalized
  destructive: false
  verify: none
  status: verified
  doc: >-
    Left channel of the input meter, normalised. Read-only. Expected to read zero on
    tracks without an audio input rather than to raise, though no such track was tested.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.input_meter_right
  path: song.tracks[{track}].input_meter_right
  access: [get, observe]
  kind: float
  range: [0.0, 1.0]
  unit: normalized
  destructive: false
  verify: none
  status: verified
  doc: >-
    Right channel of the input meter, normalised. Read-only; see track.input_meter_left.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

# ---------------------------------------------------------------------------
# Track - methods
# ---------------------------------------------------------------------------

- id: track.stop_all_clips
  path: song.tracks[{track}]
  access: [call]
  method: stop_all_clips
  kind: object
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Stop the session clips on this one track. Returns nothing; confirm by reading
    track.playing_slot_index, which should go to -1. Takes an optional boolean for
    quantised stopping (default true), so with a bar-long launch quantisation the clip
    keeps playing until the bar line and an immediate read still shows it running. Call
    verified 2026-08-30 against Live 12.4.5: invoked and it
    returned without error. The set was restored afterwards where the call had any effect.
  params:
    - {name: track, kind: int, required: true}
  args:
    - {name: quantized, kind: bool, required: false}

- id: track.delete_device
  path: song.tracks[{track}]
  access: [call]
  method: delete_device
  kind: object
  unit: none
  destructive: true
  verify: none
  status: verified
  doc: >-
    Delete the device at the given index from this track's chain. Returns nothing; confirm
    by reading track.devices. Destructive and not undoable through this server other than
    by song.undo - the device's settings go with it. Deleting shifts the index of every
    device after it, so delete from the back forwards - not because order cannot be
    corrected, it can, with song.move_device, but because every index you cached moves. Call verified 2026-08-30 against Live 12.4.5,
    on a scratch track created and deleted for the purpose. It ran and did
    what it says.
  params:
    - {name: track, kind: int, required: true}
  args:
    - {name: device_index, kind: int, required: true}

- id: track.duplicate_clip_slot
  path: song.tracks[{track}]
  access: [call]
  method: duplicate_clip_slot
  kind: object
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Duplicate the clip in the given slot into the next slot down, inserting a
    scene if needed. Returns nothing; confirm by reading track.clip_slots.
    Inserting a scene shifts every scene index below it across all tracks - re-read
    rather than compute. Measured warning about the alternative: clips that share
    one session slot also share their automation, so duplicating is right whenever
    two sections need different filter moves.
    Call verified 2026-08-30 against Live 12.4.5: signature duplicate_clip_slot(int). It
    RETURNS the new slot index (1 for a clip in slot 0), and that slot read back has_clip
    true.
  params:
    - {name: track, kind: int, required: true}
  args:
    - {name: slot_index, kind: int, required: true}

- id: track.jump_in_running_session_clip
  path: song.tracks[{track}]
  access: [call]
  method: jump_in_running_session_clip
  kind: object
  unit: beats
  destructive: false
  verify: none
  status: verified
  doc: >-
    Jump by a relative number of beats inside the session clip playing on this
    track. Returns nothing. Expected to be a no-op when nothing is playing, which was not
    measured for an idle track - check track.playing_slot_index first.
    Call verified 2026-08-30 against Live 12.4.5: signature
    jump_in_running_session_clip(double). The precondition is a clip that is actually PLAYING,
    not merely triggered: playing_slot_index reads -2 while a clip waits for the quantisation
    boundary and the jump then does nothing. With clip_trigger_quantization set to 0 and the
    transport running, playing_slot_index read 0 and a jump of 2 moved playing_position from
    0.797 to 3.077 - the 2 beats asked for, plus the 0.28 that playback alone explains between
    two round trips.
  params:
    - {name: track, kind: int, required: true}
  args:
    - {name: beats, kind: float, required: true}

- id: track.select_instrument
  path: song.tracks[{track}].view
  access: [call]
  method: select_instrument
  kind: bool
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Select this track's instrument in the GUI and return whether there was one. The return
    value would make it a usable "does this MIDI track have an instrument" probe without
    walking track.devices, but what it answers on a track with no instrument is not
    measured. Call verified 2026-08-30 against Live 12.4.5: invoked and it returned
    without error.
    The set was restored afterwards where the call had any effect.
  params:
    - {name: track, kind: int, required: true}

- id: track.view_selected_device
  path: song.tracks[{track}].view.selected_device
