# Ableton Maestro - LOM path catalog, part 2:
# Live.Track.Track, Live.MixerDevice.MixerDevice, return tracks, master track.
#
# The conventions are stated in full at the top of 10-song.yaml and are not
# repeated here. The three that matter most on this surface:
#
# * `status` is per row, and it is a measurement rather than an intention.
#   `verified` means the row was read, called or written against a running Live,
#   with the date, the Live version and which of the three in its `doc`; a
#   read-verified row is not thereby write-verified. `broken` means the path
#   exists and Live refuses it, and `doc` says how it fails. `untested` means
#   nobody has run it - the default, and never an implied "works", because a
#   wrong `verified` is worse than a missing row. scripts/probe_paths.py and
#   scripts/sync_catalog.py are what move a row, and only a `verified` row may be
#   described as working (docs/architecture.md, "the catalog").
# * A path ending on a DeviceParameter - volume, panning, sends, cue_volume,
#   crossfader, track_activator - names the parameter object, not its `.value`.
#   The script reads `.value` and adds `display` from `str_for_value()`
#   (docs/protocol.md section 5.3). Its `min`, `max`, `is_quantized`,
#   `value_items` and `default_value` are reachable as further path segments on
#   the same object when a caller needs them.
# * Group tracks live in `song.tracks` alongside everything else and are the
#   single most reliable way to break a loop over the set: they have no arm state
#   and no arrangement clips, and unguarded iteration raises at the first one
#   (measured; docs/protocol.md section 6). Every row a track sweep
#   touches says so, because a caller may only ever see that one row.
#
# The mixer scales are the other measured minefield in this file. Three numbers
# exist for one fader - the linear factor in the .als (1.0 = 0 dB), the
# normalised LOM value (0.85 = 0 dB) and the display string - and they all look
# equally plausible (measured).

# ---------------------------------------------------------------------------
# Track - identity and appearance
# ---------------------------------------------------------------------------

- id: track.name
  path: song.tracks[{track}].name
  access: [get, set, observe]
  kind: str
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    Track name. Renaming a track does not rename its clips or its devices, and nothing
    else in the LOM refers to a track by name - {track} is always an index into
    song.tracks. Group tracks appear in that list too and have no arm state and no
    arrangement clips; unguarded iteration raises at the first one (measured), so guard
    sweeps with can_be_armed or is_foldable.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.color
  path: song.tracks[{track}].color
  access: [get, set, observe]
  kind: int
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    Track colour as a packed integer, 0xRRGGBB. Live is expected to snap an arbitrary
    value to the nearest palette entry, so a read-back that differs from the request is a
    clamp, not a failure (docs/protocol.md section 5.4). Setting a track's colour
    recolours its clips only if they follow the track. Group tracks are in song.tracks as
    well and break unguarded sweeps (measured).
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.color_index
  path: song.tracks[{track}].color_index
  access: [get, set, observe]
  kind: int
  range: [0, 69]
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    Track colour as an index into Live's palette; the cleaner of the two colour rows
    because every value is legal and nothing gets snapped. The bound of 69 comes from
    Live's 70-colour palette, read from the UI and not measured against the LOM. Guard
    track sweeps against group tracks (measured).
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.is_visible
  path: song.tracks[{track}].is_visible
  access: [get, observe]
  kind: bool
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    False when the track is hidden inside a folded group. Read-only: to show it, unfold
    its group through track.fold_state on the group track. This is the property that makes
    song.visible_tracks shorter than song.tracks, and the two index spaces are not
    interchangeable.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.is_part_of_selection
  path: song.tracks[{track}].is_part_of_selection
  access: [get, observe]
  kind: bool
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Whether the track is in the current GUI selection. Read-only, and useful only for
    answering "which tracks does the human mean" - nothing in this catalog acts on a
    selection.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

# ---------------------------------------------------------------------------
# Track - mute, solo, arm
# ---------------------------------------------------------------------------

- id: track.mute
  path: song.tracks[{track}].mute
  access: [get, set, observe]
  kind: bool
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    Track mute. Measured consequence worth knowing: muting a sidechain trigger track does
    NOT cut the sidechain, because the Post FX tap sits before the mixer - a muted trigger
    track still feeds every compressor listening to it, and 13 percent of measured source
    tracks are muted for exactly that reason. Group tracks are in song.tracks
    and break unguarded sweeps (measured).
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.solo
  path: song.tracks[{track}].solo
  access: [get, set, observe]
  kind: bool
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    Track solo. Read song.exclusive_solo first when soloing in a batch: with exclusive
    solo on, a loop that solos five tracks leaves one soloed and reports five successes.
    Other tracks are then silenced without their own mute changing - see
    track.muted_via_solo. Guard sweeps against group tracks (measured).
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.muted_via_solo
  path: song.tracks[{track}].muted_via_solo
  access: [get, observe]
  kind: bool
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    True when the track is silent because something else is soloed, not because it is
    muted. Read-only. Without this row a mixdown check reads track.mute, finds false, and
    concludes the track is audible when it is not.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.arm
  path: song.tracks[{track}].arm
  access: [get, set, observe]
  kind: bool
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    Record arm. Measured: group, return and master tracks have no arm state at all, and
    touching this on one of them raises "Main and Return Tracks have no 'Arm' state!" -
    which kills the request, and an unguarded loop over song.tracks with it
    (docs/protocol.md section 6). Always read track.can_be_armed first. Note also
    song.exclusive_arm, which can quietly disarm everything else.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.can_be_armed
  path: song.tracks[{track}].can_be_armed
  access: [get, observe]
  kind: bool
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Whether this track has an arm state at all - false for group, return and master
    tracks. Read-only, and the mandatory guard before track.arm: measured, an unguarded
    sweep over song.tracks raises at the first group track and breaks the loop.
    This is the cheapest way to tell a group or a return from a normal
    track.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.implicit_arm
  path: song.tracks[{track}].implicit_arm
  access: [get, set, observe]
  kind: bool
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    Arm state set by a control surface rather than by the human's arm button. Live 11 and
    later. Expected to raise on tracks where can_be_armed is false, like track.arm - guard
    identically.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.is_frozen
  path: song.tracks[{track}].is_frozen
  access: [get, observe]
  kind: bool
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    True when the track is frozen. Read-only - freezing and unfreezing are not in the LOM.
    A frozen track ignores device parameter writes as far as sound goes while still
    storing them, which is the read-back-proves-storage-not-effect case in its purest form
    (docs/protocol.md section 10).
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

# ---------------------------------------------------------------------------
# Track - grouping and folding
# ---------------------------------------------------------------------------

- id: track.is_foldable
  path: song.tracks[{track}].is_foldable
  access: [get, observe]
  kind: bool
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    True when the track is a group track (or a rack track that can be folded open). Read-
    only, and the second mandatory guard for any sweep over song.tracks: measured, group
    tracks have no arm state and no arrangement clips, and unguarded iteration raises at
    the first one (docs/protocol.md section 6).
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.fold_state
  path: song.tracks[{track}].fold_state
  access: [get, set, observe]
  kind: int
  range: [0, 1]
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    Whether a foldable track is folded (1) or open (0). Only meaningful when
    track.is_foldable is true; on a normal track it is expected to raise or be ignored,
    and which of the two happens is not measured. Exposed as an int flag rather than a
    bool, so send 0 or 1. Folding changes which tracks are visible and therefore renumbers
    song.visible_tracks, not song.tracks.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.is_grouped
  path: song.tracks[{track}].is_grouped
  access: [get, observe]
  kind: bool
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    True when this track sits inside a group. Read-only. Grouping cannot be done through
    the LOM at all - it is Ctrl+G in the GUI - and it inserts the group track into
    song.tracks, shifting every index after it (measured). Re-read the track list after
    any grouping; do not compute the new indices.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.group_track
  path: song.tracks[{track}].group_track
  access: [get, observe]
  kind: object
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The group this track belongs to, as a handle, or none when it is not grouped. READ-
    ONLY - a track cannot be moved into or out of a group by writing here, and that is a
    real LOM gap, not a missing catalog row (docs/limits.md). Grouping is a
    GUI action, and it renumbers every track index after the new group.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.can_show_chains
  path: song.tracks[{track}].can_show_chains
  access: [get, observe]
  kind: bool
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    True when the track holds a rack whose chains can be shown as sub-tracks. Read-only.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.is_showing_chains
  path: song.tracks[{track}].is_showing_chains
  access: [get, set, observe]
  kind: bool
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    Whether a rack's chains are unfolded into sub-tracks. Only meaningful when
    track.can_show_chains is true. Like folding, this changes song.visible_tracks, not
    song.tracks.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

# ---------------------------------------------------------------------------
# Track - monitoring and routing
# ---------------------------------------------------------------------------

- id: track.current_monitoring_state
  path: song.tracks[{track}].current_monitoring_state
  access: [get, set, observe]
  kind: enum
  enum: [0, 1, 2]
  unit: none
  destructive: false
  verify: read_back
  status: verified
  means:
    "0": >-
      In - the track always passes its input, armed or not
    "1": >-
      Auto - input passes only while the track is armed. Arithmetic, not a separate reading:
      three integers, three labels, 0 and 2 both measured
    "2": >-
      Off - the input never passes
  doc: >-
    Input monitoring: 0 In, 1 Auto, 2 Off. Only exists on tracks that have an input - expected
    to raise on group, return and master tracks, exactly as track.arm does, so guard a sweep
    with track.can_be_armed (measured behaviour for arm; whether the same guard covers this is
    not measured). Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on
    this row. The value names were MEASURED 2026-08-31 against Live 12.4.5 by setting the
    property and reading Live's own switch: at 0 the track showed 'In', and a separate audio
    track sitting at 2 showed 'Off'. That leaves 'Auto' for 1 by arithmetic rather than by
    inference - three integers, three labels, two of them pinned. Live exposes no enum type for
    this property, so enum_names cannot reach it: checked in the running interpreter and in
    Live's own _MxDCore/LomTypes, neither has one. The tracks were restored. A second,
    independent reading agrees and adds what the switch cannot say - which setting real projects
    use: measured on the MonitoringEnum field of 923 audio tracks across the saved-project
    corpus, 814 sit on 2 and 755 of those carry audio clips, which is the ordinary playback
    track; the 17 tracks on 0 are exactly those fed by another track or by Ext. In, and none of
    them has clips. The .als field and the LOM property use the same numbering - the two were
    cross-checked and agree.
  params:
    - {name: track, kind: int, required: true}

- id: track.input_routing_type
  path: song.tracks[{track}].input_routing_type
  access: [get, set, observe]
  kind: object
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    Where the track takes its input from, as a RoutingType object with display_name and
    identifier. Reading gives a handle (docs/protocol.md section 7). Writing needs one of
    the objects out of track.available_input_routing_types - a plain string is expected to
    fail with type_error, because the LOM wants the object and not its name. Whether the
    script can accept a display_name shim is not measured.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.available_input_routing_types
  path: song.tracks[{track}].available_input_routing_types
  access: [get, observe]
  kind: list
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Every input source this track will accept, as handles carrying display_name and
    identifier. Read-only, and the only honest source for a routing name - the list
    depends on the audio interface, the other tracks in the set and the Live version, so a
    hard-coded name is a guess.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.input_routing_channel
  path: song.tracks[{track}].input_routing_channel
  access: [get, set, observe]
  kind: object
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    Which channel of the chosen input source is used (the second routing dropdown, e.g.
    "1/2" or "Post FX"). Same object-not-string limitation as track.input_routing_type.
    Note that the channel list changes when the type changes, so set the type first and
    re-read the channels.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.available_input_routing_channels
  path: song.tracks[{track}].available_input_routing_channels
  access: [get, observe]
  kind: list
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The channels available for the currently selected input routing type, as handles.
    Read-only, and only valid for the type that is selected right now.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.output_routing_type
  path: song.tracks[{track}].output_routing_type
  access: [get, set, observe]
  kind: object
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    Where the track sends its output, as a RoutingType object. Same object-not-string limitation
    as the input side. A compressor's sidechain source is often said to have no property behind
    it, needing channel B with Live closed. It is neither: the source is a routing field on the
    DEVICE rather than on the track, and it is present - device.input_routing_type, writable in
    the open set, no file edit and no restart (docs/limits.md). Read verified 2026-08-29 against
    Live 12.4.5. WRITE measured 2026-09-01 against Live 12.4.5: four tracks moved from 'Sends
    Only' onto a group and the group onto Main, each confirmed afterwards through
    output_routing_type.display_name. A plain string is refused as documented - the script
    answers not_settable and names the {"__path__": ...} form. One observation without an
    explanation: writing a reference taken from available_output_routing_types can come back
    with clamped true while the routing is exactly right, apparently when Live resolves the
    reference to a different entry than the one requested. Writing back the entry a track
    already holds does NOT clamp (measured). So on this row confirm a write through display_name
    rather than through clamped.
  params:
    - {name: track, kind: int, required: true}

- id: track.available_output_routing_types
  path: song.tracks[{track}].available_output_routing_types
  access: [get, observe]
  kind: list
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Every output destination this track will accept, as handles. Read-only. Includes the
    other tracks in the set, so this list changes whenever a track is created or deleted.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.output_routing_channel
  path: song.tracks[{track}].output_routing_channel
  access: [get, set, observe]
  kind: object
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    Which channel of the chosen output destination is used - for a track-to-track routing
    this is where "Pre FX", "Post FX" and "Post Mixer" live. Same object-not-string
    limitation as the other three routing rows. The Post FX tap is the reason a muted
    trigger track still drives a sidechain (measured).
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.available_output_routing_channels
  path: song.tracks[{track}].available_output_routing_channels
  access: [get, observe]
  kind: list
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The channels available for the currently selected output routing type, as handles.
    Read-only, and valid only for the type selected right now.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.input_sub_routing
  path: song.tracks[{track}].current_input_sub_routing
  access: [get, set, observe]
  kind: str
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    The input channel as a plain string, e.g. "1/2". Older than the routing-object API and
    kept for compatibility - which makes it the one routing property that can actually be
    written over a JSON wire without a handle. An unknown string is expected to be ignored
    silently, which is precisely the failure the read-back in lom_set is there to expose
    (docs/architecture.md, "read-back as a principle"); what an unknown string actually
    does is not measured.
    Path corrected 2026-08-29 against Live 12.4.5 (the previous spelling did not exist);
    read verified, a write was NOT attempted.
  params:
    - {name: track, kind: int, required: true}

- id: track.output_sub_routing
  path: song.tracks[{track}].current_output_sub_routing
  access: [get, set, observe]
  kind: str
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    The output channel as a plain string, e.g. "Post FX". Same legacy status and the same
    silent-rejection risk as track.input_sub_routing, and the same practical value: it is
    settable without an object handle. What an unknown string does here is not measured
    either.
    Path corrected 2026-08-29 against Live 12.4.5 (the previous spelling did not exist);
    read verified, a write was NOT attempted.
  params:
    - {name: track, kind: int, required: true}

- id: track.input_routing
  path: song.tracks[{track}].current_input_routing
  access: [get, set]
  kind: str
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    The input source as a plain string. Deprecated since Live 9.5 in favour of
    track.input_routing_type, and the bare input_routing spelling is gone - the path here
    carries the current_ prefix that Live still answers. Catalogued because it is a
    string-settable route to something that otherwise needs an object handle.
    Path corrected 2026-08-29 against Live 12.4.5 (the previous spelling did not exist);
    read verified, a write was NOT attempted.
  params:
    - {name: track, kind: int, required: true}

- id: track.output_routing
  path: song.tracks[{track}].current_output_routing
  access: [get, set]
  kind: str
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    The output destination as a plain string. Deprecated alongside track.input_routing and
    reached the same way, through the current_ prefix. Writing has not been tried, so
    probe before building anything on it.
    Path corrected 2026-08-29 against Live 12.4.5 (the previous spelling did not exist);
    read verified, a write was NOT attempted.
  params:
    - {name: track, kind: int, required: true}

- id: track.has_audio_input
  path: song.tracks[{track}].has_audio_input
  access: [get]
  kind: bool
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    True for audio tracks and for anything else that accepts audio in. Read-only. With
    has_midi_input this is how you tell an audio track from a MIDI track without guessing
    from the name - and combined with can_be_armed it separates real tracks from groups,
    returns and the master during a sweep (measured that the unguarded sweep raises).
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.has_audio_output
  path: song.tracks[{track}].has_audio_output
  access: [get]
  kind: bool
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    True when the track emits audio - which includes MIDI tracks carrying an instrument.
    Read-only. A MIDI track with no instrument has midi input and no audio output, and
    that is the cheapest test for "this track will never make a sound".
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: track.has_midi_input
  path: song.tracks[{track}].has_midi_input
  access: [get]
  kind: bool
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    True for MIDI tracks. Read-only, and the guard that belongs in front of every
