  access: [call]
  method: create_midi_clip
  kind: object
  unit: none
  destructive: false
  verify: none
  status: broken
  doc: >-
    Track.create_midi_clip() exists on the object at song.return_tracks[0] in the running Live
    and is on the Remote Script's allowlist, so lom_call will attempt it. Its arguments were NOT
    read: the LOM publishes no signature over this channel, so `args` is empty and a call that
    needs arguments will answer type_error until somebody fills them in. What it returns is
    unknown, hence kind: object. Nothing has called it; this row is a reachable hypothesis,
    not a capability, and the run that found it is recorded in the sync_catalog report rather
    than here, because an untested row may not carry a measurement note.
    Live refuses this on a return track, and the reason is structural rather than a missing
    specimen: a return track has NO clip slots (clip_slots reads count 0) and no arrangement
    clips ('Main, Group and Return Tracks have no arrangement clips'), so the object this call
    needs cannot exist there. The method itself is on the allowlist and works on an ordinary
    track. Measured 2026-08-30 against Live 12.4.5.
  params:
    - {name: ret, kind: int, required: true}

