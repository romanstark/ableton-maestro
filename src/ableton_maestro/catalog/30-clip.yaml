# ---- clip methods: automation ---------------------------------------
#
# Automation is not a property, which is why it has its own handlers
# (automation_read / automation_write / automation_clear, docs/protocol.md
# section 5.9). The rows here are the LOM primitives underneath them, and the
# place where the Session-only limitation is recorded.

- id: clip.automation_envelope
  path: song.tracks[{track}].clip_slots[{slot}].clip
  access: [call]
  method: automation_envelope
  destructive: false
  verify: none
  status: verified
  doc: >-
    Get the automation envelope for one device parameter, given as a parameter handle, or
    None when the clip has no curve for it. MEASURED TRAP, and it is the reason the
    Session and Arrangement routes are separate areas in this file - quoting the Live
    Object Model: it returns None for Arrangement clips, and None for parameters belonging
    to a different track. So: write automation into a SESSION clip, then duplicate the
    clip into the Arrangement. Never the reverse. The envelope object it returns is not
    path-addressable (it comes from a call, not an attribute), so its own members -
    value_at_time(), insert_step() - are reached through the automation_* handlers, which
    sample it because Live cannot enumerate breakpoints. Second measured trap for anyone
    sampling by hand: at time 0 Live returns the parameter's default value, not the curve,
    so verify at t greater than 0. Call verified 2026-08-30 against Live 12.4.5, on a scratch
    track created and deleted for the purpose.
  params:
    - {name: track, kind: int, required: true}
    - {name: slot, kind: int, required: true}
  args:
    - {name: parameter, kind: object, required: true}

- id: clip.create_automation_envelope
  path: song.tracks[{track}].clip_slots[{slot}].clip
  access: [call]
  method: create_automation_envelope
  destructive: false
  verify: envelope_present
  status: verified
  doc: >-
    Create an empty envelope for a device parameter so that steps can be inserted into it.
    Create an empty envelope for a device parameter so that steps can be inserted into it.
    Needed because automation_envelope() returns None rather than creating one. The method has
    not existed in every Live version - treat its presence as version-dependent. Session clips
    only, for the same reason as automation_envelope. Call verified 2026-08-30 against Live
    12.4.5, on a scratch track created and deleted for the purpose.
  params:
    - {name: track, kind: int, required: true}
    - {name: slot, kind: int, required: true}
  args:
    - {name: parameter, kind: object, required: true}

- id: clip.clear_envelope
  path: song.tracks[{track}].clip_slots[{slot}].clip
  access: [call]
  method: clear_envelope
  destructive: true
  verify: envelope_absent
  status: verified
  doc: >-
    Delete the envelope for one device parameter. Destructive and the only way to remove a
    curve - there is no Envelope.clear(); the method lives on the clip, not on the
    envelope. Measured context for why this matters more than it looks: writing a second
    sweep onto a parameter that already has one does not merge them, the second replaces
    the first, and an un-cleared leftover from an earlier run is indistinguishable from an
    intentional curve. Clear first, then write. Call verified 2026-08-30 against Live
    12.4.5, on a scratch track created and deleted for the
    purpose. It ran and did what it says.
  params:
    - {name: track, kind: int, required: true}
    - {name: slot, kind: int, required: true}
  args:
    - {name: parameter, kind: object, required: true}

- id: clip.clear_all_envelopes
  path: song.tracks[{track}].clip_slots[{slot}].clip
  access: [call]
  method: clear_all_envelopes
  destructive: true
  verify: envelope_absent
  status: verified
  doc: >-
    Delete every clip envelope in this clip at once. Destructive, wide, and unrecoverable
    through this API - it takes curves on devices nobody was thinking about along with the
    one being fixed. Prefer clip.clear_envelope with the specific parameter. Verify with
    clip.has_envelopes, which should read false afterwards. Call verified 2026-08-30
    against Live 12.4.5, on a scratch track created and deleted
    for the purpose. It ran and did what it says.
  params:
    - {name: track, kind: int, required: true}
    - {name: slot, kind: int, required: true}

- id: clip.view_show_envelope
  path: song.tracks[{track}].clip_slots[{slot}].clip.view
  access: [call]
  method: show_envelope
  destructive: false
  verify: none
  status: verified
  doc: >-
    Open the envelope lane in the clip editor. Purely a view action - it changes what a
    human sees and nothing about the data. Useful at the end of an automation pass so the
    result is visible rather than merely written. Call verified 2026-08-30 against Live
    12.4.5, on a scratch track created and deleted for the purpose.
  params:
    - {name: track, kind: int, required: true}
    - {name: slot, kind: int, required: true}

- id: clip.view_hide_envelope
  path: song.tracks[{track}].clip_slots[{slot}].clip.view
  access: [call]
  method: hide_envelope
  destructive: false
  verify: none
  status: verified
  doc: >-
