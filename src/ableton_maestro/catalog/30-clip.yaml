- id: clip.set_notes
  path: song.tracks[{track}].clip_slots[{slot}].clip
  access: [call]
  method: set_notes
  destructive: true
  verify: notes_count
  status: broken
  doc: >-
    MEASURED TRAP - the name is wrong. Clip.set_notes() APPENDS. It does not
    replace, even though the name and Live's own API description both suggest it
    does. Measured at the artefact, not inferred: seven lead clips of 63
    humanised notes each, then a second call sending a different 23-note melody
    to the same clip, left 86 notes in the clip - two melodies stacked in bars
    1-4 - and the call reported 23, the length of the list it was given, not the
    length of the clip. A second call is never a correction; it is a duplication
    that reports success. Marked destructive so the executor demands confirm=True
    before it can be reached at all. The right route is the notes_set handler,
    which defaults to mode replace and performs remove-then-write inside one
    handler call (docs/protocol.md section 5.8). Reach for this row only when
    appending is genuinely what is wanted, and verify with notes_get afterwards.
    REFUSED by this script's allowlist, by design: Live's legacy note API, deprecated by
    Ableton. It discards MPE and probability data, and it opens a modal dialog that blocks
    Live's main thread until a human clicks it (measured 2026-08-29 against Live 12.4.5).
