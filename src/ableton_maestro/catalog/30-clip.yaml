    human sees selected in the editor, so it is not entirely invisible. Call verified
    2026-08-30 against Live 12.4.5: invoked and it returned
    without error. The set was restored afterwards where the call had any effect.
  params:
    - {name: track, kind: int, required: true}
    - {name: slot, kind: int, required: true}

