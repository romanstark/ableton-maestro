# =====================================================================
# arrangement_clip - the same Clip class, reached from the timeline
#
# song.tracks[{track}].arrangement_clips[{clip}] ... - every row takes
# `track` and `clip`, where `clip` is the index in the track's arrangement
# clip list, NOT a scene number and NOT a slot.
#
# Same class, different route, and three differences that matter:
#
#   1. Automation. clip.automation_envelope() returns None here, always.
#      Write in Session, then duplicate. See
#      arrangement_clip.automation_envelope.
#   2. Position. start_time and end_time are the clip's place on the song
#      timeline, and they are read-only - there is no LOM way to slide an
#      Arrangement clip. Positioning happens at duplication time.
#   3. Launch. The launch properties (launch_mode, launch_quantization,
#      legato, the follow actions) exist on the object because it is the
#      same class, but they govern Session launching. On the timeline they
#      are expected to be inert. That expectation is not measured; the rows
#      are present so probe_paths.py can settle it rather than being left
#      out on a guess.
#
# And the trap that decides whether this list exists at all: group tracks
# have NO arrangement clips, and unguarded iteration over song.tracks raises
# on the first one (docs/protocol.md section 6, measured).
# =====================================================================

- id: arrangement_clip.list
  path: song.tracks[{track}].arrangement_clips
  access: [get, observe]
  kind: list
  unit: none
  verify: read_back
  status: verified
  doc: >-
    All clips on one track's Arrangement timeline, in an order that is expected to follow
    start_time. Measured trap: group tracks have no arrangement clips at all, and touching
    this path on one raises - check track.is_foldable first, because an exception inside
    Live's process kills the socket. This list is also the verification for a duplication
    pass: read the start_time of every entry, and if they are all 0.0 you have hit the
    destination_time trap recorded on arrangement_clip.duplicate_from_session.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}

- id: arrangement_clip.name
  path: song.tracks[{track}].arrangement_clips[{clip}].name
  access: [get, set, observe]
  kind: str
  unit: none
  verify: read_back
  status: verified
  doc: >-
    Name of an Arrangement clip. Free text and not unique; the index in arrangement_clips
    is the only reliable handle. A clip duplicated from the Session carries the Session
    clip's name, so a timeline full of identically named clips is normal and not a sign of
    a failed duplication - check start_time for that.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: clip, kind: int, required: true}

- id: arrangement_clip.color
  path: song.tracks[{track}].arrangement_clips[{clip}].color
  access: [get, set, observe]
  kind: int
  unit: none
  verify: read_back
  status: verified
  doc: >-
    Arrangement clip colour as 0x00RRGGBB. Same behaviour and the same palette-snapping
    caveat as clip.color; no write has tested either. Colour is the cheapest way to make a
    section structure legible to the human who has to work in the set afterwards.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: clip, kind: int, required: true}

- id: arrangement_clip.color_index
  path: song.tracks[{track}].arrangement_clips[{clip}].color_index
  access: [get, set, observe]
  kind: int
  range: [0, 69]
  unit: none
  quantized: true
  verify: read_back
  status: verified
  doc: >-
    Arrangement clip colour as a palette index. Preferable to the RGB form when the intent
    is a colour Live actually has. No write has probed the upper bound.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: clip, kind: int, required: true}

- id: arrangement_clip.is_midi_clip
  path: song.tracks[{track}].arrangement_clips[{clip}].is_midi_clip
  access: [get]
  kind: bool
  unit: none
  verify: read_back
  status: verified
  doc: >-
    Whether this timeline clip holds MIDI notes. The guard before any note operation on
    it.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: clip, kind: int, required: true}

- id: arrangement_clip.is_audio_clip
  path: song.tracks[{track}].arrangement_clips[{clip}].is_audio_clip
  access: [get]
  kind: bool
  unit: none
  verify: read_back
  status: verified
  doc: >-
    Whether this timeline clip holds a sample. The guard before warping, warp_mode,
    pitch_coarse, pitch_fine, gain, ram_mode and file_path, all of which are expected to
    raise on a MIDI clip.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: clip, kind: int, required: true}

- id: arrangement_clip.is_arrangement_clip
  path: song.tracks[{track}].arrangement_clips[{clip}].is_arrangement_clip
  access: [get]
  kind: bool
  unit: none
  verify: read_back
  status: verified
  doc: >-
    Expected to be true for everything reached through this route. Worth reading exactly
    once in a verification pass, because it is the property that predicts whether
    automation_envelope() will return an envelope or None - and that single distinction is
    the reason this area exists separately.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: clip, kind: int, required: true}

- id: arrangement_clip.file_path
  path: song.tracks[{track}].arrangement_clips[{clip}].file_path
  access: [get]
  kind: str
  unit: none
  verify: read_back
  status: verified
  doc: >-
    Absolute path of the sample behind an Arrangement audio clip. Read-only. Reading this
    across a whole track is how you tell a rendered stem from a duplicated Session clip
    without opening the project file.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: clip, kind: int, required: true}

- id: arrangement_clip.sample_length
  path: song.tracks[{track}].arrangement_clips[{clip}].sample_length
  access: [get]
  kind: int
  unit: none
  verify: read_back
  status: verified
  doc: >-
    Length of the underlying sample in sample frames (not beats, not seconds - the unit
    vocabulary has no entry for frames). Combined with the project tempo this is the auto-
    warp check on the timeline: expected beats = frames / sample_rate * bpm / 60.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: clip, kind: int, required: true}

- id: arrangement_clip.is_playing
  path: song.tracks[{track}].arrangement_clips[{clip}].is_playing
  access: [get, observe]
  kind: bool
  unit: none
  verify: read_back
  status: verified
  doc: >-
    Whether the transport is currently inside this clip and playing it. Unlike the Session
    case this is not something you cause by firing the clip - it follows the song
    position.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: clip, kind: int, required: true}

- id: arrangement_clip.is_triggered
  path: song.tracks[{track}].arrangement_clips[{clip}].is_triggered
  access: [get, observe]
  kind: bool
  unit: none
  verify: read_back
  status: verified
  doc: >-
    Whether the clip is armed and waiting for a launch quantization boundary. Present
    because this is the same class as a Session clip; on the timeline there is no launch
    to wait for, so it is expected to read false always. Whether it always does is not
    measured - the row exists so that gets confirmed rather than assumed.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: clip, kind: int, required: true}

- id: arrangement_clip.will_record_on_start
  path: song.tracks[{track}].arrangement_clips[{clip}].will_record_on_start
  access: [get, observe]
  kind: bool
