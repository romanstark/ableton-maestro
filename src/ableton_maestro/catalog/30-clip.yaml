- id: arrangement_clip.start_time
  path: song.tracks[{track}].arrangement_clips[{clip}].start_time
  access: [get, observe]
  kind: float
  unit: beats
  verify: read_back
  status: verified
  doc: >-
    Where this clip sits on the song timeline, in beats from the start of the Arrangement.
    The single most useful number in this area: it is what a duplication pass must be
    verified against. Measured trap it detects - a duplication call whose time argument is
    spelled anything other than destination_time falls back silently to 0.0, so 116
    duplications produced one clip per track, all stacked on beat 0, every call reporting
    success. If every start_time in arrangement_clip.list reads 0.0, that is this bug and
    not a coincidence. Documented read-only; if it turns out to be writable it would be
    the only LOM way to move an Arrangement clip after it exists. Nothing else in the
    catalog can: destination_time on arrangement_clip.duplicate_from_session fixes the
    position at creation, and arrangement_clip.position moves the loop brace inside the
    clip, not the clip along the timeline - worth probing explicitly.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: clip, kind: int, required: true}

