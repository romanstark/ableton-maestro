# ---- arrangement clip: getting clips onto the timeline ---------------
#
# These three rows are addressed at the TRACK, not at a clip - they are how a
# clip comes to exist on the timeline in the first place, so they take only
# `track`.

- id: arrangement_clip.duplicate_from_session
  path: song.tracks[{track}]
  access: [call]
  method: duplicate_clip_to_arrangement
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    Copy a Session clip onto this track's Arrangement timeline at destination_time (beats
    from the start of the Arrangement). The clip is passed as a handle, the time as a
    float. This is THE route from Session to Arrangement, and the order it imposes is
    architecture rather than taste - envelopes live inside the clip and travel with the
    copy, so notes and automation must be finished in the Session clip BEFORE this call.
    Measured trap, the expensive one: whoever duplicates first and writes the curve
    afterwards ends up with the curve in the Session clip and in no Arrangement clip at
    all - and automation_read confirms it, because it reads the Session clip. Second
    measured trap: a time argument spelled anything other than destination_time falls back
    silently to 0.0, so 116 duplications produced one clip per track stacked on beat 0
    with exit code 0. Verify by reading start_time across arrangement_clip.list, never by
    trusting the call's result. Live 11 and later. The method is on the script's allowlist,
    and a change to the script needs a Live restart before it reaches Live at all
    (protocol section 9), so read script_info first if a call is refused.
    Measured 2026-08-29 against Live 12.4.5: WORKS. The refusal had been the script's
    method allowlist, not the LOM. A session clip with a volume ramp duplicated to
    beat 0 gave 1 arrangement clip, and reading the saved .als afterwards showed the
    arrangement clip carrying its OWN identical ClipEnvelope (same pointee, 133 events) -
    so clip automation does travel with the duplicate.
  params:
    - {name: track, kind: int, required: true}
  args:
    - {name: clip, kind: object, required: true}
    - {name: destination_time, kind: float, required: true}

- id: arrangement_clip.delete
  path: song.tracks[{track}]
  access: [call]
  method: delete_clip
  destructive: true
  verify: read_back
  status: verified
  doc: >-
    Delete one Arrangement clip from this track, passed as a handle. Destructive
    and unrecoverable through this API. It is also the standard repair for the
    two duplication traps above - a clip on the wrong beat, or one that arrived
    without its envelope, cannot be fixed in place, it has to go and be
    duplicated again. Verify by re-reading arrangement_clip.list and counting.
    Call verified 2026-08-30 against Live 12.4.5: signature delete_clip(AClip) on the Track,
    with the clip passed by path. The clip was gone - its index answered index_out_of_range -
    and the neighbouring Arrangement clip read back unchanged.
  params:
    - {name: track, kind: int, required: true}
  args:
    - {name: clip, kind: object, required: true}

- id: arrangement_clip.create_midi
  path: song.tracks[{track}]
  access: [call]
  method: create_midi_clip
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    Create an empty MIDI clip directly on the Arrangement timeline between two beat
    positions, without going through a Session clip. It removes the whole
    Session-then-duplicate detour for material that needs no automation - which is why it
    is here. Newer Live versions only, and MIDI tracks only. Call verified 2026-08-30
    against Live 12.4.5, on a scratch track created and deleted for the purpose.
  params:
    - {name: track, kind: int, required: true}
  args:
    - {name: start_time, kind: float, required: true}
    - {name: end_time, kind: float, required: true}

