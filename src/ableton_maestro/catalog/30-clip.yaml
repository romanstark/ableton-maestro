# ---- clip methods: transport ----------------------------------------

- id: clip.fire
  path: song.tracks[{track}].clip_slots[{slot}].clip
  access: [call]
  method: fire
  destructive: false
  verify: playing_state
  status: verified
  doc: >-
    Launch this clip. Equivalent to clip_slot.fire for an occupied slot; prefer the slot
    form, because it also works when the slot is empty (where it stops the track) and
    because it does not need the clip to exist first. Subject to launch quantization, so
    is_playing may still be false immediately afterwards while is_triggered is true. Call
    verified 2026-08-30 against Live 12.4.5, on a scratch track
    created and deleted for the purpose. It ran and did what it says.
  params:
    - {name: track, kind: int, required: true}
    - {name: slot, kind: int, required: true}

- id: clip.stop
  path: song.tracks[{track}].clip_slots[{slot}].clip
  access: [call]
  method: stop
  destructive: false
  verify: playing_state
  status: verified
  doc: >-
    Stop this clip. Like fire, it is subject to the track's launch quantization, so the
    stop can be pending rather than immediate. Call verified 2026-08-30 against Live
    12.4.5, on a scratch track created and deleted for the
    purpose. It ran and did what it says.
  params:
    - {name: track, kind: int, required: true}
    - {name: slot, kind: int, required: true}

- id: clip.set_fire_button_state
  path: song.tracks[{track}].clip_slots[{slot}].clip
  access: [call]
  method: set_fire_button_state
  destructive: false
  verify: playing_state
  status: verified
  doc: >-
    Hold (True) or release (False) the clip's launch button, as a control surface would.
    The only way to drive Gate and Repeat launch modes, which need a held button. Always
    release what you hold - a stuck True is a clip that never stops. Call verified
    2026-08-30 against Live 12.4.5, on a scratch track created
    and deleted for the purpose.
  params:
    - {name: track, kind: int, required: true}
    - {name: slot, kind: int, required: true}
  args:
    - {name: state, kind: bool, required: true}

- id: clip.move_playing_pos
  path: song.tracks[{track}].clip_slots[{slot}].clip
  access: [call]
  method: move_playing_pos
  destructive: false
  verify: none
  status: verified
  doc: >-
    Jump the clip's playhead by a relative number of beats while it plays. Negative moves
    backwards. Does nothing on a stopped clip. Verifiable only by reading
    clip.playing_position immediately afterwards, and that value moves on its own, so
    treat any check as approximate. Call verified 2026-08-30 against Live 12.4.5, on a scratch
    track created and deleted for the purpose.
  params:
    - {name: track, kind: int, required: true}
    - {name: slot, kind: int, required: true}
  args:
    - {name: beats, kind: float, required: true}

- id: clip.scrub
  path: song.tracks[{track}].clip_slots[{slot}].clip
  access: [call]
  method: scrub
  destructive: false
  verify: none
  status: verified
  doc: >-
    Start scrubbing the clip from an absolute clip-local beat position - the audible drag
    through the material Live performs when a user scrubs the clip ruler. Keeps scrubbing
    until clip.stop_scrub is called; leaving it running is a stuck sound. Not a way to set
    the play position: use clip.move_playing_pos for that. Call verified 2026-08-30
    against Live 12.4.5, on a scratch track created and deleted
    for the purpose.
  params:
    - {name: track, kind: int, required: true}
    - {name: slot, kind: int, required: true}
  args:
    - {name: beat_time, kind: float, required: true}

- id: clip.stop_scrub
  path: song.tracks[{track}].clip_slots[{slot}].clip
  access: [call]
  method: stop_scrub
  destructive: false
  verify: none
  status: verified
  doc: >-
    End a scrub started with clip.scrub. Harmless when nothing is scrubbing. Always pair
    it with the scrub call, including on the error path. Call verified 2026-08-30 against
    Live 12.4.5, on a scratch track created and deleted for the
    purpose.
  params:
    - {name: track, kind: int, required: true}
    - {name: slot, kind: int, required: true}

# ---- clip methods: shaping the clip ---------------------------------

- id: clip.quantize
  path: song.tracks[{track}].clip_slots[{slot}].clip
  access: [call]
  method: quantize
  destructive: false
  verify: notes_count
  status: verified
  doc: >-
    Quantize the clip's notes to a grid. `quantization_grid` is Live's grid enum as an
    integer (mapping not asserted here); `amount` is 0.0..1.0, where 1.0 snaps hard and
    lower values pull partway, which is what preserves a human feel. MIDI clips only. It
    moves notes irreversibly within the clip - the note count does not change, so a count
    check proves nothing; read the notes back with notes_get if the exact result matters.
    Quantizing after a humanisation pass undoes the humanisation, so order the two
    deliberately. Call verified 2026-08-30 against Live 12.4.5,
    on a scratch track created and deleted for the purpose. It ran and did
    what it says.
  params:
    - {name: track, kind: int, required: true}
    - {name: slot, kind: int, required: true}
  args:
    - {name: quantization_grid, kind: int, required: true}
    - {name: amount, kind: float, required: true}

- id: clip.quantize_pitch
  path: song.tracks[{track}].clip_slots[{slot}].clip
  access: [call]
  method: quantize_pitch
  destructive: false
  verify: notes_count
  status: verified
  doc: >-
    Quantize only the notes of one pitch, leaving the rest of the clip alone - the way to
    tighten a hi-hat row without touching the kick. Takes the MIDI note number, then the
    same grid and amount as clip.quantize. MIDI clips only. Call verified 2026-08-30
    against Live 12.4.5, on a scratch track created and deleted for the purpose. It ran
    and did what it says.
  params:
    - {name: track, kind: int, required: true}
    - {name: slot, kind: int, required: true}
  args:
    - {name: pitch, kind: int, required: true}
    - {name: quantization_grid, kind: int, required: true}
    - {name: amount, kind: float, required: true}

- id: clip.crop
  path: song.tracks[{track}].clip_slots[{slot}].clip
  access: [call]
  method: crop
  destructive: true
  verify: clip_length
  status: verified
  doc: >-
    Discard everything outside the loop brace and keep only what is inside. Destructive and not
    undoable through this API - material outside the loop is gone from the clip (the source file
    is untouched for audio, but a MIDI clip loses those notes). Check clip.loop_start and
    clip.loop_end before calling, not after. Clip envelopes are cropped with the clip, which is
    a second way an automation curve can quietly become shorter than it was. Call verified
    2026-08-30 against Live 12.4.5, on a scratch track created and deleted for the purpose. It
    ran and did what it says. Destroys everything outside the loop brace and there is no undo
    through this path beyond Live's own.
  params:
    - {name: track, kind: int, required: true}
    - {name: slot, kind: int, required: true}

- id: clip.duplicate_loop
  path: song.tracks[{track}].clip_slots[{slot}].clip
  access: [call]
  method: duplicate_loop
  destructive: false
  verify: clip_length
  status: verified
  doc: >-
    Double the loop length and copy the existing material into the new half - the scripted
    form of Live's Duplicate Loop button, the usual way to grow a 4-bar idea into 8 bars
    with something to edit in the second half. Not undoable through this API; verify by
    reading clip.length, which should have doubled. Clip envelopes are expected to be
    duplicated along with the notes; that half is not measured. Call verified 2026-08-30
    against Live 12.4.5, on a scratch track created and deleted for the purpose. It ran
    and did what it says.
  params:
    - {name: track, kind: int, required: true}
    - {name: slot, kind: int, required: true}

- id: clip.duplicate_region
  path: song.tracks[{track}].clip_slots[{slot}].clip
  access: [call]
  method: duplicate_region
  destructive: false
  verify: notes_count
  status: verified
  doc: >-
    Copy a beat range of the clip to another position inside the same clip, optionally
    transposing the copy. The argument list given here - region_start, region_length,
    destination_time, transposition_amount - is taken from Live's documentation; the exact
    arity has varied between Live versions, and the fourth argument has not been passed
    here. Call lom_describe on the clip and check before relying on it. MIDI clips. Call
    verified 2026-08-30 against Live 12.4.5, on a scratch track created and deleted for
    the purpose.
  params:
    - {name: track, kind: int, required: true}
    - {name: slot, kind: int, required: true}
  args:
    - {name: region_start, kind: float, required: true}
    - {name: region_length, kind: float, required: true}
    - {name: destination_time, kind: float, required: true}
    - {name: transposition_amount, kind: int, required: false}

- id: clip.add_warp_marker
  path: song.tracks[{track}].clip_slots[{slot}].clip
  access: [call]
  method: add_warp_marker
  destructive: false
  verify: warp_state
  status: broken
  doc: >-
    Add a warp marker to an audio clip, pinning a point in the sample to a point on the
    beat grid. Live 11 and later. This and its siblings are how a wrongly auto-warped
    import could be repaired from a script rather than by hand - which is why they belong
    in the catalog even where the generic path cannot reach them. Measured
    2026-08-30 against Live 12.4.5: the method exists and is on the allowlist, but it is
    NOT reachable through lom_call. It takes a Live value object (a MidiNoteSpecification,
    a WarpMarker) that has to be CONSTRUCTED inside Live, and lom_call passes JSON through; Live answers type_error "No registered converter was able to produce...". The
    {"__path__": ...} form resolves an EXISTING object; it cannot build a new one. Use the
    notes_set handler instead, which constructs the specifications itself (verified: the
    same write that failed here succeeded through notes_set). This is the boundary of the
    generic path and the reason the specialised handlers exist at all.
  params:
    - {name: track, kind: int, required: true}
    - {name: slot, kind: int, required: true}
  args:
    - {name: warp_marker, kind: object, required: true}

- id: clip.move_warp_marker
  path: song.tracks[{track}].clip_slots[{slot}].clip
  access: [call]
  method: move_warp_marker
  destructive: false
  verify: warp_state
  status: verified
  doc: >-
    Move an existing warp marker, identified by its current beat time, by a beat
    distance. Live 11 and later. Read clip.warp_markers before and after to see
    what actually moved.
    Call verified 2026-08-30 against Live 12.4.5: signature move_warp_marker(double
    marker_beat_time, double beat_time_distance). The marker at beat 4 was moved to 3 and back
    to 4, read back each time. The LAST marker of a clip cannot be moved: Live answers 'The
    shadow marker can't be moved.'
  params:
    - {name: track, kind: int, required: true}
    - {name: slot, kind: int, required: true}
  args:
    - {name: marker_beat_time, kind: float, required: true}
    - {name: beat_time_distance, kind: float, required: true}

- id: clip.remove_warp_marker
  path: song.tracks[{track}].clip_slots[{slot}].clip
  access: [call]
  method: remove_warp_marker
  destructive: true
  verify: warp_state
  status: verified
  doc: >-
    Remove the warp marker at a given beat time. Destructive: warp markers are
    the clip's timing map, and removing the wrong one re-times everything after
    it. Live keeps at least one marker, so removing the last is expected to fail
    rather than unwarp the clip - use clip.warping for that. Live 11 and later.
    Call verified 2026-08-30 against Live 12.4.5: signature remove_warp_marker(double
    beat_time). Called with 4 on a warped audio clip; warp_markers read back 3 -> 2. Not
    undoable from here - add_warp_marker takes a WarpMarker object, which cannot be built over
    JSON.
  params:
    - {name: track, kind: int, required: true}
    - {name: slot, kind: int, required: true}
  args:
    - {name: marker_beat_time, kind: float, required: true}

- id: clip.beat_to_sample_time
  path: song.tracks[{track}].clip_slots[{slot}].clip
  access: [call]
  method: beat_to_sample_time
  destructive: false
  verify: none
  status: verified
  doc: >-
    Convert a clip-local beat position into a position in the sample, following the clip's
    warp map. Read-only in effect. This is the honest way to answer "which part of the
    file is playing at beat 8" on a warped clip, where the relationship is not linear.
    Audio clips only; Live 11 and later. Call verified 2026-08-30 against Live 12.4.5, on
    a scratch track created and deleted for the purpose. Audio clips only: a MIDI clip
    answers live_error "Conversion is only available for audio clips".
  params:
    - {name: track, kind: int, required: true}
    - {name: slot, kind: int, required: true}
  args:
    - {name: beat_time, kind: float, required: true}

- id: clip.sample_to_beat_time
  path: song.tracks[{track}].clip_slots[{slot}].clip
  access: [call]
  method: sample_to_beat_time
  destructive: false
  verify: none
  status: verified
  doc: >-
    The inverse of clip.beat_to_sample_time: from a position in the sample to the clip-
    local beat where it sounds. Audio clips only; Live 11 and later. Call verified
    2026-08-30 against Live 12.4.5, on a scratch track created and deleted for the
    purpose. Audio clips only, same refusal on a MIDI clip.
  params:
    - {name: track, kind: int, required: true}
    - {name: slot, kind: int, required: true}
  args:
    - {name: sample_time, kind: float, required: true}

# ---- clip methods: notes --------------------------------------------
#
# These are the LOM's own note methods. The normal route for reading and
# writing notes is the notes_get / notes_set handler pair (docs/protocol.md
# section 5.8), which does a real read-modify-write inside Live in one round
# trip and defaults to replace. The rows below exist because the catalog must
# describe the surface honestly, and because a caller sometimes needs the
# primitive. Prefer notes_set.

- id: clip.get_notes_extended
  path: song.tracks[{track}].clip_slots[{slot}].clip
  access: [call]
  method: get_notes_extended
  destructive: false
  verify: none
  status: verified
  doc: >-
    Read notes in a pitch and time window, with the Live 11 note extensions (probability,
    velocity_deviation, release_velocity, note id). Arguments are from_pitch, pitch_span,
    from_time, time_span - the whole clip is (0, 128, 0.0, clip.length). Times are clip-
    local beats. Prefer the notes_get handler, which normalises the result into note
    objects and omits extension fields Live did not supply rather than inventing defaults.
    Call verified 2026-08-30 against Live 12.4.5: invoked and it
    answered "2". The call only reads; nothing in the set was changed. Probe it on a MIDI
    clip: an audio clip answers live_error "Notes are only available in Midi Clips", which
    is about the clip, not this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: slot, kind: int, required: true}
  args:
    - {name: from_pitch, kind: int, required: true}
    - {name: pitch_span, kind: int, required: true}
    - {name: from_time, kind: float, required: true}
    - {name: time_span, kind: float, required: true}

- id: clip.get_selected_notes_extended
  path: song.tracks[{track}].clip_slots[{slot}].clip
  access: [call]
  method: get_selected_notes_extended
  destructive: false
  verify: none
  status: verified
  doc: >-
    Read only the notes currently selected in Live's editor. The bridge between what a
    human has highlighted on screen and what a script operates on - "transpose what I
    selected" is this call followed by clip.apply_note_modifications. Live 11 and later.
    Call verified 2026-08-30 against Live 12.4.5:
    invoked and it answered "0". The call only reads; nothing in the set was
    changed. Returns what is selected in the clip view, so 0 is the normal answer for a
    clip nobody has clicked into.
  params:
    - {name: track, kind: int, required: true}
    - {name: slot, kind: int, required: true}

- id: clip.add_new_notes
  path: song.tracks[{track}].clip_slots[{slot}].clip
  access: [call]
  method: add_new_notes
  destructive: false
  verify: notes_count
  status: broken
  doc: >-
    Add notes to the clip without removing anything - the Live 11 successor to set_notes,
