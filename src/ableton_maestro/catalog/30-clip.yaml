- id: arrangement_clip.automation_envelope
  path: song.tracks[{track}].arrangement_clips[{clip}]
  access: [call]
  method: automation_envelope
  destructive: false
  verify: none
  status: verified
  doc: >-
    MEASURED LIMIT, and the single most important row in this area. On an Arrangement clip
    this returns None. Always. Quoting the Live Object Model directly - it returns the
    envelope for the given parameter, None if the envelope does not exist, None for
    Arrangement clips, and None for parameters from a different track. There is no way to
    write clip automation here, and no argument or Live version changes that. The working
    order is therefore fixed: create the Session clip, write its notes, write its
    automation, and only then duplicate it to the Arrangement, where the envelope travels
    with the copy. Never the reverse. The trap that follows from getting the order wrong
    is silent - automation_read on the Session clip still reports has_envelope true and
    is_flat false, so the verification passes while every Arrangement clip is empty.
    Checking that requires the saved project file: Channel B, docs/limits.md. Call
    verified 2026-08-30 against Live 12.4.5, on a scratch track
    created and deleted for the purpose.
  params:
    - {name: track, kind: int, required: true}
    - {name: clip, kind: int, required: true}
  args:
    - {name: parameter, kind: object, required: true}

- id: arrangement_clip.create_automation_envelope
  path: song.tracks[{track}].arrangement_clips[{clip}]
  access: [call]
  method: create_automation_envelope
  destructive: false
  verify: envelope_present
  status: broken
  doc: >-
    Create an envelope for a device parameter on a timeline clip. Expected to
    fail or to return something unusable, for the same reason
    arrangement_clip.automation_envelope returns None - clip automation is a
    Session-clip facility. Listed rather than omitted so probe_paths.py records
    which of the two it does. If it unexpectedly works, docs/limits.md needs rewriting, not
    this file.
    Live refuses this on an Arrangement clip: 'RuntimeError: Not a session clip or parameter
    belongs to another track.' (measured 2026-08-30 against Live 12.4.5). This is the same
    wall as clip.automation_envelope returning None here - automation belongs to Session
    clips. Write the envelope in a Session clip and duplicate that clip into the Arrangement;
    the automation travels.
  params:
    - {name: track, kind: int, required: true}
    - {name: clip, kind: int, required: true}
  args:
    - {name: parameter, kind: object, required: true}

- id: arrangement_clip.clear_envelope
  path: song.tracks[{track}].arrangement_clips[{clip}]
  access: [call]
  method: clear_envelope
  destructive: true
  verify: envelope_absent
  status: verified
  doc: >-
    Delete the envelope for one device parameter on a timeline clip. Envelopes can be
    PRESENT here even though they cannot be created here - they arrive with a duplicated
    Session clip - so removal may well work where creation does not; that it removes
    anything has not been read back. Destructive, and a clip whose envelope has been
    cleared cannot get it back except by being deleted and duplicated again. Call verified
    2026-08-30 against Live 12.4.5, on a scratch track created and deleted for the
    purpose.
  params:
    - {name: track, kind: int, required: true}
    - {name: clip, kind: int, required: true}
  args:
    - {name: parameter, kind: object, required: true}

- id: arrangement_clip.clear_all_envelopes
  path: song.tracks[{track}].arrangement_clips[{clip}]
  access: [call]
  method: clear_all_envelopes
  destructive: true
  verify: none
  status: verified
  doc: >-
    Delete every clip envelope on this timeline clip at once. Destructive and
    wide; it takes curves nobody was thinking about along with the one being
    fixed, and on the Arrangement they cannot be rewritten - only re-duplicated
    from the Session. Prefer arrangement_clip.clear_envelope with a named
    parameter. Note also what this does NOT touch: track automation, which is not
    part of any clip and is invisible to the LOM entirely (docs/limits.md).
    Measured 2026-08-30 against Live 12.4.5: the call runs without error on an Arrangement
    clip, and its effect cannot be read back there - an Arrangement clip has no envelope to
    clear, because create_automation_envelope is refused on it and automation_envelope answers
    None. Accepted, unconfirmed.
  params:
    - {name: track, kind: int, required: true}
    - {name: clip, kind: int, required: true}

