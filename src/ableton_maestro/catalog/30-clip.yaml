    material; that is the documented behaviour here, not a trap, but the outcome is
    identical to the set_notes trap. Verify with notes_get, whose count is the clip's
    count and not the count you sent. Measured 2026-08-30 against Live 12.4.5: the method
    exists and is on the allowlist, but it is NOT reachable through lom_call. It takes a
    Live value object (a MidiNoteSpecification, a WarpMarker) that has to be CONSTRUCTED
    inside Live, and lom_call passes JSON through; Live answers type_error "No
    registered converter was able to produce...". The {"__path__": ...} form resolves an
    EXISTING object; it cannot build a new one. Use the notes_set handler instead, which
    constructs the specifications itself (verified: the same write that failed here
    succeeded through notes_set). This is the boundary of the generic path and the reason
    the specialised handlers exist at all.
