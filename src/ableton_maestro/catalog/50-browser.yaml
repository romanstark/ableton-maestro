# =============================================================================
# Browser methods
# =============================================================================

- id: browser.load_item
  path: app.browser
  access: [call]
  method: load_item
  destructive: true
  verify: none
  status: verified
  doc: >-
    Load a browser entry into the set. Args: [item], where item must be a BrowserItem
    OBJECT: the caller passes a path such as app.browser.instruments.children[3] and the
    script resolves it (see this file's header). Four things that decide whether this call
    does what was meant. (1) IT TAKES NO TRACK ARGUMENT. It loads onto whatever is
    selected (read from the source, not measured). Set song.view.selected_track
    immediately before calling, or aim the load with browser.hotswap_target. (2) An EFFECT is
    APPENDED to the end of the chain; an INSTRUMENT REPLACES the instrument already on the
    track. The second half is why this row is marked destructive: loading an instrument
    onto a track that already has one silently discards it, together with every parameter
    the user configured on it and every clip envelope pointing at it. (3) LOADING PLUGINS
    IN RAPID SUCCESSION CAN CRASH LIVE (measured; a batch load during a background plugin
    rescan plus a licence dialog took the whole application down). Pace batch loads, write
    results to disk after each item rather than at the end, check the connection between
    loads, and save the set first. (4) A successful return proves the call ran, not that
    anything sounds. The measured Drum Rack case reported loaded: true with a silent
    track. Verify by reading the track's device list and, for a rack, that rack.chains is
    non-empty.
    Measured 2026-08-29 against Live 12.4.5: loading a .mid from a user folder WORKS and
    creates a NEW TRACK carrying the file's clip - it does not fill the selected clip slot
    (one file gave a 204-beat clip with 364 notes). A probe that only checks the target
    slot will wrongly conclude the load failed.
    Loading an INSTRUMENT renames the track, but only while the track still carries Live's
    default name. Measured 2026-08-30 against Live 12.4.5: loading Operator onto '2-MIDI' left
    the track called '2-Operator', while the same load onto a track renamed 'MyBass'
    beforehand left 'MyBass' untouched. An EFFECT never renames - a track carrying two
    Compressors was still '4-Audio'. A track name cached from an earlier get_session is
    therefore stale after an instrument load onto a default-named track.
  params: []

- id: browser.preview_item
  path: app.browser
  access: [call]
  method: preview_item
  destructive: false
  verify: none
  status: verified
  doc: >-
    Audition a browser entry without loading it. Args: [item], a BrowserItem
    object handed over as a path. Non-destructive and the polite way to check a
    sample. It makes SOUND, which matters if a human is in the room or a
    recording is running. Whether preview works for devices as well as for
    samples was not tested.
    Call verified 2026-08-30 against Live 12.4.5: signature preview_item(TPythonBrowserItem) -
    the item is passed by path. Called on a browser item and ended with stop_preview.
  params: []

- id: browser.stop_preview
  path: app.browser
  access: [call]
  method: stop_preview
  destructive: false
  verify: none
  status: verified
  doc: >-
    Stop whatever browser.preview_item started. Args: []. Call it in a finally block: a
    preview left running is the audible equivalent of the measured probe that left Delay
    Feedback at 100 %. Call verified 2026-08-30 against Live 12.4.5 with Remote Script
    0.6.x, on a scratch track created and deleted for the purpose. Called with no
    arguments.
  params: []

- id: browser.relation_to_hotswap_target
  path: app.browser
  access: [call]
  method: relation_to_hotswap_target
  destructive: false
  verify: none
  status: verified
  doc: >-
    Ask how a browser entry relates to the current hot-swap target: whether it
    is the loaded one, a sibling, or unrelated). Args: [item], a BrowserItem
    object handed over as a path. Returns an integer relation code whose
    mapping is not known here; probe it against a known-loaded preset to learn
    which code means "this is the one".
    Call verified 2026-08-30 against Live 12.4.5: signature
    relation_to_hotswap_target(TPythonBrowserItem). Returned the int 3 for an item while
    app.browser.hotswap_target was null.
  params: []

# =============================================================================
# Groove pool
#
#   EVERY ROW IN THIS BLOCK IS UNVERIFIED, AND SO IS THE BLOCK ITSELF. Grooves
#   are the timing and velocity templates in Live's Groove Pool. Whether the
#   LOM exposes the pool as `song.groove_pool.grooves` at all is not established here -
#   docs/architecture.md, "the catalog" lists the groove pool as a target with the word
#   "unverified" next to it, and no measurement exists. These rows are written so
#   probe_paths.py has something to aim at; a
#   missing row cannot be probed, and a silently omitted feature stays missing
#   forever (docs/architecture.md, "the catalog").
#
#   If the probe comes back empty, the whole block moves to docs/limits.md and
#   the groove pool becomes a channel-B question: the .als stores the pool,
#   and reading it there does not depend on the LOM.
# =============================================================================

- id: groove.pool
  path: song.groove_pool.grooves
  access: [get, observe]
  kind: list
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The Groove Pool: every groove loaded into this set, in pool order. Unlike the
    browser's groove files (.agr, under browser.user_library), these are the grooves the
    set actually carries and the only ones a clip can be assigned. Every row below it in
    this block hangs off this property.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params: []

- id: groove.name
  path: song.groove_pool.grooves[{groove}].name
  access: [get, set, observe]
  kind: str
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    A groove's name in the pool. Expected to be writable, though that write was not
    attempted. The name is how a human recognises a groove and the only identifier the
    pool offers; there is no stable id, so a plan that names a groove must re-resolve it
    after the pool changes.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: groove, kind: int, required: true}

- id: groove.quantization_amount
  path: song.groove_pool.grooves[{groove}].quantization_amount
  access: [get, set, observe]
  kind: float
  range: [0.0, 1.0]
  unit: normalized
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    How strongly the groove pulls notes onto its own grid before applying its timing
    offsets (Live's "Quantize" control in the Groove Pool). 0 leaves the performance
    alone, 1 hard-quantises first. Neither that behaviour nor the range was tested.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: groove, kind: int, required: true}

- id: groove.timing_amount
  path: song.groove_pool.grooves[{groove}].timing_amount
  access: [get, set, observe]
  kind: float
  range: [0.0, 1.0]
  unit: normalized
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    How much of the groove's timing displacement is applied (the "Timing" control). This
    is the one that makes a groove audible at all: at 0 the groove is assigned and does
    nothing, which looks exactly like a failed assignment. The range was not tested:
    Live's GUI shows this as a percentage that can exceed 100 %, so the 0..1 bound here is
    a guess.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: groove, kind: int, required: true}

- id: groove.random_amount
  path: song.groove_pool.grooves[{groove}].random_amount
  access: [get, set, observe]
  kind: float
  range: [0.0, 1.0]
  unit: normalized
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    How much random timing deviation the groove adds on top of its pattern: the "Random"
    control. Non-deterministic by design, which means a set with a non-zero random amount
    does not play back identically twice and no read-back can prove what was heard.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: groove, kind: int, required: true}

- id: groove.velocity_amount
  path: song.groove_pool.grooves[{groove}].velocity_amount
  access: [get, set, observe]
  kind: float
  range: [-1.0, 1.0]
  unit: normalized
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    How much the groove reshapes note velocities (the "Velocity" control), which Live
    shows as a signed percentage, so negative values invert the accent pattern. The range
    here is a guess from the GUI, not a measurement.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: groove, kind: int, required: true}

- id: groove.base
  path: song.groove_pool.grooves[{groove}].base
  access: [get, set, observe]
  kind: enum
  enum: [0, 1, 2, 3, 4, 5]
  range: [0, 4]
  unit: none
  destructive: false
  verify: read_back
  status: verified
  means:
    "0": >-
      gb_four - 1/4. Easy to miss: it is the value most listings of this enum leave
      out, and leaving it out shifts every other value by one
    "1": >-
      gb_eight - 1/8
    "2": >-
      gb_eight_triplet - 1/8 triplet
    "3": >-
      gb_sixteen - 1/16
    "4": >-
      gb_sixteen_triplet - 1/16 triplet
    "5": >-
      gb_thirtytwo - 1/32
  doc: >-
    The note grid the groove's timing offsets are measured against. Wire value is the
    integer index; both the names and their order are read off Live's GUI, not from a
    measurement. Getting this wrong shifts the whole feel by a subdivision, which is
    audible immediately and easy to misdiagnose as the groove "not working".
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
    Value names read off Live.Groove.Base through the enum_names handler (docs/protocol.md
    section 5.12), measured 2026-08-31 against Live 12.4.5 - not transcribed from a reference.
    Cycling 74's LOM documentation agrees.
  params:
    - {name: groove, kind: int, required: true}

- id: groove.global_amount
  path: song.groove_amount
  access: [get, set, observe, automate]
  kind: float
  range: [0.0, 1.0]
  unit: normalized
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    The global Groove Amount slider: one multiplier over every groove in the set at once.
    Setting it to 0 disables every groove without unassigning anything, which is the
    fastest A/B test of whether a groove is doing anything at all. NOTE FOR THE
    MAINTAINER: this is Song.groove_amount and therefore also belongs to the song area
    (docs/architecture.md, "the catalog" lists it under Song/Transport). It is here because it is unusable
    without the rest of this block. If the song catalog file also carries it, keep one row
    and delete the other; two ids on one path is a registry problem waiting to happen.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params: []

- id: groove.clip_assignment
  path: song.tracks[{track}].clip_slots[{slot}].clip.groove
  access: [get, set, observe]
  kind: object
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    Which groove a Session clip plays with, as a handle; None when the clip has none.
    Assigning takes a Groove OBJECT, not a name and not a pool index, so the caller hands
    over a path like song.groove_pool.grooves[2] for the script to resolve: the same
    object problem as browser.load_item). Setting it to None removes the assignment. A
    groove changes when notes sound WITHOUT changing the notes: notes_get still returns
    the written positions, so a groove is invisible to every note-level check and can only
    be confirmed by reading this property. The read is measured; assigning a groove, and
    clearing it with None, is not.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: slot, kind: int, required: true}

- id: groove.clip_assignment_name
  path: song.tracks[{track}].clip_slots[{slot}].clip.groove.name
  access: [get]
  kind: str
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The name of the groove assigned to a Session clip, read through the clip: the one-
    call answer to "does this clip have a groove, and which". On a clip with no groove the
    property is None rather than an object, so the read fails there: check
    groove.clip_assignment first. Read verified 2026-08-30 against Live 12.4.5
    AFTER assigning a groove: returned "Swing 16ths 66". Probing a clip with no groove
    answers no_such_path "NoneType has no attribute 'name'", which is a fact about the
    clip and not about this row; the container is optional, so the precondition has to
    be built before the row can be probed at all.
  params:
    - {name: track, kind: int, required: true}
    - {name: slot, kind: int, required: true}

- id: groove.arrangement_clip_assignment
  path: song.tracks[{track}].arrangement_clips[{clip}].groove
  access: [get, set, observe]
  kind: object
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    The groove assigned to an Arrangement clip. Listed separately because Arrangement
    clips have repeatedly turned out to be the poor relations of the LOM; measured,
    clip.automation_envelope() returns None for them, which is why automation must be
    written in Session and duplicated afterwards. It is plausible that grooves behave the
    same way; that is a guess and needs a probe. If it fails, the workaround is the same
    one: assign in Session, then duplicate into the Arrangement.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: track, kind: int, required: true}
    - {name: clip, kind: int, required: true}

