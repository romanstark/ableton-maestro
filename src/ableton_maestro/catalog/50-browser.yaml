# Ableton Maestro: path catalog: browser and groove pool.
#
# WHY this file exists: the browser is the only way anything new enters a Live
# set. Tracks, clips and mixer values can all be created from the object model,
# but a device or a sample has to be found in the browser and loaded; if
# the browser is not catalogued, "load an instrument" stays a hand-written
# handler forever, which is exactly what docs/architecture.md, "the restart tax" is trying to avoid.
# Schema: docs/architecture.md, "the catalog". Wire contract: docs/protocol.md.
#
# THE BROWSER IS A SECOND OBJECT GRAPH. It hangs off `app`
# (Live.Application.get_application()), not off `song`, and it recurses to
# arbitrary depth with tens of thousands of nodes. A catalog row can describe
# its SHAPE (a root, an item, an item's children) but not its contents, and
# walking it is a job for the `browser_walk` handler with its own depth limit,
# result cap and its own clock: the walk truncates itself at 7.5 s, inside a 9 s
# handler budget, inside the client's 10 s read class (docs/protocol.md §5.10, §8). The rows here are
# for reaching a known place cheaply; they are not a substitute for the walk.
#
# ONE OBJECT PROBLEM RUNS THROUGH THE WHOLE FILE. Browser.load_item(),
# preview_item() and the hotswap target all take a BrowserItem OBJECT, not a
# URI string and not an index. `lom_call` passes a JSON list as `args`
# (docs/protocol.md §5.5), and a live object cannot survive JSON; it comes
# back as a handle, `{"__lom__": ...}` (§7). So the caller hands over a PATH to
# the item, e.g. app.browser.instruments.children[3], and the script resolves
# it to the object before calling. That resolution step is settled and written
# down: an argument of the form `{"__path__": "<path>"}` is resolved through the
# same resolver, with the same guards, as any other path (docs/protocol.md
# §5.5, "Passing a Live object as an argument"), and the browser handler in the
# Remote Script implements it. A `__path__` argument therefore reaches nothing a
# plain `lom_get` could not, and `browser_walk` returns a `path` on every entry
# so that a search result feeds straight back into load_item.
#
# STATUS DISCIPLINE. `status` is per row, and it is a measurement rather than an
# intention. `verified` means the row was read, called or written against a
# running Live: its `doc` carries the date, the Live version and which of the
# three was done, and a row proved by a read is not thereby proved by a write.
# `broken` means the path exists and Live refuses it, and `doc` says how it
# fails. `untested` means nobody has run it; it is the default, and it is never
# an implied "works". scripts/probe_paths.py and scripts/sync_catalog.py are what
# move a row. A tool description built on this file may say "works" only for a
# `verified` row (docs/architecture.md, "the catalog"): a wrong `verified` is
# worse than a missing row.

# =============================================================================
# Browser roots
#   Live.Browser, reachable at app.browser. Each root is a BrowserItem whose
#   .children are the entries under it.
# =============================================================================

- id: browser.root
  path: app.browser
  access: [get]
  kind: object
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The browser itself, as a handle. Useful mainly as a target for lom_describe, which
    lists the roots this Live build actually offers. Read that list at runtime rather
    than assuming it: the set of roots differs between Live editions (Intro, Standard,
    Suite) and between versions.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params: []

- id: browser.instruments
  path: app.browser.instruments
  access: [get]
  kind: object
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The Instruments category. Its children are the stock instruments and their preset
    folders. Loading an instrument onto a track REPLACES the instrument already there (
    see browser.load_item), and read the track's device list first if the old one mattered.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params: []

- id: browser.drums
  path: app.browser.drums
  access: [get]
  kind: object
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The Drums category, and the one browser folder with a measured trap. Its FIRST child
    is the *Drum Rack* device itself (the empty container) and the actual kits are the
    .adg files listed below it (974 of them in the measured installation). A name search
    for "Drum Rack" therefore hits the empty container: the load reports success, the
    device list shows a DrumGroupDevice, every clip and note check stays green, and the
    track is silent. Load a .adg, or load the container and then check that rack.chains is
    non-empty.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params: []

- id: browser.sounds
  path: app.browser.sounds
  access: [get]
  kind: object
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The Sounds category (Live's curated instrument presets), organised by musical role
    rather than by device. Entries here load as instruments and therefore replace the
    track's existing instrument.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params: []

- id: browser.audio_effects
  path: app.browser.audio_effects
  access: [get]
  kind: object
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The Audio Effects category. Entries here are APPENDED to the end of the track's device
    chain; they never replace anything, and they never land in the middle. The loading
    order is therefore the running order, unless it is corrected afterwards with
    song.move_device.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params: []

- id: browser.midi_effects
  path: app.browser.midi_effects
  access: [get]
  kind: object
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The MIDI Effects category (Arpeggiator, Chord, Scale, Velocity). Appended like audio
    effects, but Live places them before the instrument in the chain, because that is the
    only position where they do anything.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params: []

- id: browser.plugins
  path: app.browser.plugins
  access: [get]
  kind: object
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Third-party VST2, VST3 and AU plugins. Two measured facts belong on this root. First,
    a freshly loaded VST usually reports only its "Device On" parameter until controls are
    picked up through Live's Configure mode; a limit in Live, per parameter and per
    instance, 128 slots maximum, GUI only. Second, VST2 plugins never report units, so no
    display reading is available for them however they are configured. Both are covered in
    detail in 40-device.yaml under device.parameters and param.str_for_value.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params: []

- id: browser.max_for_live
  path: app.browser.max_for_live
  access: [get]
  kind: object
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Max for Live devices. Worth knowing when identifying what got loaded: measured, a
    large part of Live 12's instrument section reports the class name "MxDeviceInstrument"
    (Max devices) wearing a stock device's face, and they are indistinguishable
    from real stock devices by class name alone.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params: []

- id: browser.samples
  path: app.browser.samples
  access: [get]
  kind: object
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Raw audio files. Loading one onto a MIDI track wraps it in a Simpler; loading it onto
    an audio track creates a clip. Measured on imported audio: Live warps it on arrival,
    short files are rounded to whole bars and long ones get a GUESSED tempo, and the warp
    analysis runs asynchronously; a measurement taken immediately after loading measures
    a half-finished state.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params: []

- id: browser.clips
  path: app.browser.clips
  access: [get]
  kind: object
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Browsable clips (.alc). Loading one places a whole clip, with its notes, envelopes and
    device chain, into a clip slot; that load has not been tested from here. This root is
    not present in every Live version.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params: []

- id: browser.packs
  path: app.browser.packs
  access: [get]
  kind: object
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Installed Packs, one child per Pack. The fastest way to find out what content this
    particular installation actually has before a plan depends on it; a URI from another
    machine's Pack resolves to nothing here.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params: []

- id: browser.user_library
  path: app.browser.user_library
  access: [get]
  kind: object
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The User Library: saved presets, racks, samples and grooves. This is the same folder
    tree that holds Remote Scripts, and its location is written in Preferences\Library.cfg
    under <ProjectPath>: do not guess it, it is frequently not Documents (measured).
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params: []

- id: browser.user_folders
  path: app.browser.user_folders
  access: [get]
  kind: object
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Folders the user added to the browser sidebar (Live's "Places"). Live 11 and later;
    absent on older builds.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params: []

- id: browser.current_project
  path: app.browser.current_project
  access: [get]
  kind: object
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The current Live project's own folder, as browsed. This is where a project's recorded
    audio and its imported samples live, so it answers "what files does this set depend
    on" without touching the file system directly.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params: []

- id: browser.legacy_libraries
  path: app.browser.legacy_libraries
  access: [get]
  kind: object
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Libraries carried over from older Live installations. Usually empty.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params: []

- id: browser.colors
  path: app.browser.colors
  access: [get]
  kind: list
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Live's colour palette as browser entries: the swatches that back track.color,
    clip.color and chain.color_index. Reading it is the honest way to learn which colours
    exist rather than assuming an RGB value will survive a write; Live snaps an arbitrary
    colour to the nearest swatch. The read did not record whether this comes back as a
    list or as a single BrowserItem.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params: []

- id: browser.filter_type
  path: app.browser.filter_type
  access: [get, set]
  kind: int
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    Which filter the browser is currently applying: how Live narrows the list when a
    hotswap target is set, so that only loadable things are shown. Left as a plain int:
    the LOM's FilterType has a named enum, but the names and their order are not known
    here and guessing them would be worse than saying so. Probe it with a hotswap target
    set and again with none.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params: []

- id: browser.hotswap_target
  path: app.browser.hotswap_target
  access: [get, set]
  kind: object
  unit: none
  destructive: false
  verify: read_back
  status: verified
  doc: >-
    The device or pad the browser is currently hot-swapping into: Live's "Hot-Swap" mode,
    as a property. Setting it aims the next load at a specific place instead of at the
    selected track, which is the only way to put a sample on a chosen Drum Rack pad
    without moving the GUI selection. Takes a live object (a Device, a DrumPad or a
    Chain), so the caller hands over a resolvable path, not a string: see the object
    problem in this file's header. Setting it to None leaves hot-swap mode. Nothing on the
    write side here: the aiming, the object argument, the None: has been tested.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params: []

# =============================================================================
# BrowserItem: one entry, one level down from a root
#   Live.Browser.BrowserItem. `{root}` is the name of a browser root:
#   instruments, drums, sounds, audio_effects, midi_effects, plugins,
#   max_for_live, samples, clips, packs, user_library, user_folders,
#   current_project, legacy_libraries. It substitutes as a plain attribute
#   name, which the resolver's grammar allows (docs/protocol.md §6).
# =============================================================================

- id: browser.item
  path: app.browser.{root}.children[{index}]
  access: [get]
  kind: object
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    One entry directly under a browser root, as a handle. This is the object that
    browser.load_item and browser.preview_item want, so this path is what a caller passes
    them. Indices are positional and shift whenever the user's content changes: resolve
    by name or URI first, then act, and never cache an index across sessions.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: root, kind: enum, required: true, enum: [audio_effects, clips, current_project, drums, instruments, legacy_libraries, max_for_live, midi_effects, packs, plugins, samples, sounds, user_folders, user_library]}
    - {name: index, kind: int, required: true}

- id: browser.item_name
  path: app.browser.{root}.children[{index}].name
  access: [get]
  kind: str
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The entry's display name, exactly as the browser shows it: including the file
    extension for files, so a kit reads as "Kit-909 Classic.adg". Matching on this is how
    a search works, and it is also how the measured Drum Rack trap bites: "Drum Rack"
    matches the empty container device, never a kit.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: root, kind: enum, required: true, enum: [audio_effects, clips, current_project, drums, instruments, legacy_libraries, max_for_live, midi_effects, packs, plugins, samples, sounds, user_folders, user_library]}
    - {name: index, kind: int, required: true}

- id: browser.item_uri
  path: app.browser.{root}.children[{index}].uri
  access: [get]
  kind: str
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The entry's stable identifier: "query:Synths#..." for stock content, "vst3:..." or
    "vst:..." for plugins, a file URL for user content. The right thing to record when a
    plan needs to name a device, because a URI survives a browser reordering where an
    index does not. It does NOT survive moving to another machine: a URI pointing into a
    Pack that is not installed there resolves to nothing. A URI carries its category in
    it, which is enough to guess which root to search first; purely an optimisation, but
    a reminder of what the string is made of.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: root, kind: enum, required: true, enum: [audio_effects, clips, current_project, drums, instruments, legacy_libraries, max_for_live, midi_effects, packs, plugins, samples, sounds, user_folders, user_library]}
    - {name: index, kind: int, required: true}

- id: browser.item_is_folder
  path: app.browser.{root}.children[{index}].is_folder
  access: [get]
  kind: bool
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Whether the entry contains other entries. A folder is never loadable; the two flags
    are the pair to check before descending or before loading. Note that an entry can be a
    folder AND have a device-like name: Live's preset folders are named after the device
    they belong to.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: root, kind: enum, required: true, enum: [audio_effects, clips, current_project, drums, instruments, legacy_libraries, max_for_live, midi_effects, packs, plugins, samples, sounds, user_folders, user_library]}
    - {name: index, kind: int, required: true}

- id: browser.item_is_device
  path: app.browser.{root}.children[{index}].is_device
  access: [get]
  kind: bool
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Whether the entry is a device rather than a preset or a file. Measured in the drums
    folder: the empty Drum Rack container reports is_device true while every real kit
    reports is_device false and is_loadable true, because the kits are .adg preset files.
    So is_device true is not a quality mark; in that folder it is the warning sign.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: root, kind: enum, required: true, enum: [audio_effects, clips, current_project, drums, instruments, legacy_libraries, max_for_live, midi_effects, packs, plugins, samples, sounds, user_folders, user_library]}
    - {name: index, kind: int, required: true}

- id: browser.item_is_loadable
  path: app.browser.{root}.children[{index}].is_loadable
  access: [get]
  kind: bool
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Whether browser.load_item would accept this entry. Check it before loading: calling
    load_item on a folder is expected to raise inside Live, and an exception escaping a
    handler kills the client connection (docs/protocol.md §6).
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: root, kind: enum, required: true, enum: [audio_effects, clips, current_project, drums, instruments, legacy_libraries, max_for_live, midi_effects, packs, plugins, samples, sounds, user_folders, user_library]}
    - {name: index, kind: int, required: true}

- id: browser.item_is_selected
  path: app.browser.{root}.children[{index}].is_selected
  access: [get]
  kind: bool
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Whether this entry is the one highlighted in Live's browser GUI. Read-only here.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: root, kind: enum, required: true, enum: [audio_effects, clips, current_project, drums, instruments, legacy_libraries, max_for_live, midi_effects, packs, plugins, samples, sounds, user_folders, user_library]}
    - {name: index, kind: int, required: true}

- id: browser.item_source
  path: app.browser.{root}.children[{index}].source
  access: [get]
  kind: str
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    Where the entry comes from: the Pack name, "User Library", or empty for built-in
    content. The cheap way to tell a Pack-dependent choice from one that works on any
    installation.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: root, kind: enum, required: true, enum: [audio_effects, clips, current_project, drums, instruments, legacy_libraries, max_for_live, midi_effects, packs, plugins, samples, sounds, user_folders, user_library]}
    - {name: index, kind: int, required: true}

- id: browser.item_children
  path: app.browser.{root}.children[{index}].children
  access: [get]
  kind: list
  unit: none
  destructive: false
  verify: none
  status: verified
  doc: >-
    The entries inside a folder. Reading this on a deep folder is where a browser walk
    gets expensive, which is why the walk caps its recursion depth and caches URI lookups.
    For anything wider than one folder, use the browser_walk handler with its depth limit
    and result cap rather than stepping through these rows.
    Read verified 2026-08-29 against Live 12.4.5; a write was NOT attempted on this row.
  params:
    - {name: root, kind: enum, required: true, enum: [audio_effects, clips, current_project, drums, instruments, legacy_libraries, max_for_live, midi_effects, packs, plugins, samples, sounds, user_folders, user_library]}
    - {name: index, kind: int, required: true}

